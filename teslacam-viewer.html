<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAMO TeCam — TeslaCam Viewer</title>
<meta name="theme-color" content="#17312f">
<link rel="icon" type="image/png" href="lamo-tecam-logo-v2.png">
<link rel="apple-touch-icon" href="lamo-tecam-logo-v2.png">
<style>
:root{
  color-scheme: dark;              /* select 팝업·스크롤바가 테마를 따라가게 */
  --bg:#0E1113; --surface:#171B1E; --surface2:#21262A; --line:#2C3338;
  --ink:#E7ECEF; --muted:#9AA4AB; --faint:#6E787F;
  --ok:#57D9A3; --warn:#E8A33D; --alert:#F0685E; --info:#5BC8F5;
  /* 타임라인·지도의 표시 색. 세 가지뿐이고 뜻이 하나씩 붙어 있다.
     상시(배경) · 사건(무슨 일이 있었다) · 재생 불가(암호화).
     밝기·채도·색약 분리·배경 대비를 계산해 고른 값이라 눈대중으로 바꾸지 않는다. */
  --tl-idle:#57616A; --tl-event:#3E9FD0; --tl-dead:#E05A50;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme: light;
    --bg:#F3F5F6; --surface:#FFFFFF; --surface2:#E8ECEE; --line:#DDE2E5;
    --ink:#14181B; --muted:#5C666D; --faint:#8B949A;
    /* 밝은 배경에서는 같은 색이 묻힌다. 흰 바탕용으로 따로 고른 값. */
    --tl-idle:#97A1A8; --tl-event:#1E7FB8; --tl-dead:#C4342C;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  -webkit-font-smoothing:antialiased}
button, select, input, textarea{font:inherit;color:inherit}
select.btn{color:var(--ink);background:var(--surface2)}
select.btn option{color:var(--ink);background:var(--surface)}
.wrap{display:grid;grid-template-rows:auto 1fr;height:100%}

/* ---- 헤더 ---- */
.hd{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:var(--surface)}
.hd h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.hd .sub{font-size:12px;color:var(--muted);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.4;cursor:default}
.btn[hidden]{display:none}
.btn.go{background:color-mix(in srgb,var(--ok) 16%,var(--surface2));border-color:var(--ok);color:var(--ok)}

/* ---- 본문 ---- */
.body{display:grid;grid-template-columns:330px 1fr;min-height:0}
@media (max-width:900px){ .body{grid-template-columns:1fr;grid-template-rows:auto 1fr} }

.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
/* display:flex 가 UA 의 [hidden]{display:none} 를 이긴다. 명시하지 않으면 숨겨도 남는다. */
.side[hidden]{display:none}
.body.noside{grid-template-columns:1fr}
.filters{display:flex;gap:6px;padding:11px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer}
.chip.on{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.ev{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 55%,transparent)}
.segbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 14px;display:flex;flex-direction:column;gap:9px}
.segrow{display:flex;gap:6px;flex-wrap:wrap}
.list{overflow-y:auto;flex:1;min-height:0}
.item{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{background:var(--surface2)}
.item.on{background:color-mix(in srgb,var(--ok) 10%,var(--surface2));
  box-shadow:inset 3px 0 0 var(--ok)}
.item .when{font-size:13.5px;font-weight:600}
.item .meta{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:keep-all}
.pill{font-size:10px;padding:3px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);
  white-space:nowrap;flex-shrink:0}
.pill.sentry{background:color-mix(in srgb,var(--warn) 22%,var(--surface2));color:var(--warn)}
.pill.saved{background:color-mix(in srgb,var(--ok) 20%,var(--surface2));color:var(--ok)}
.pill.enc{background:color-mix(in srgb,var(--alert) 20%,var(--surface2));color:var(--alert)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px;gap:12px;overflow-y:auto}
/* 화면 높이에 맞춰 줄인다. 4:3 비율로 두면 2행이 화면을 넘겨 재생 컨트롤이 아래로 밀린다. */
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-auto-rows:minmax(0,1fr);height:min(64vh,660px)}
.grid.one{grid-template-columns:1fr}
/* 하나를 고르면 왼쪽에 크게, 나머지는 오른쪽에 작게 세워 둔다. */
.grid.focus{grid-template-columns:minmax(0,1fr) clamp(118px,17%,230px);
  grid-template-rows:repeat(var(--n,3),minmax(0,1fr))}
.grid.focus .cell.big{grid-column:1;grid-row:1/span var(--n,3)}
.grid.focus .cell.sm{grid-column:2;cursor:zoom-in}
.grid.focus .cell.sm .tag{font-size:9.5px;padding:2px 6px;left:6px;top:6px}
.grid.focus .cell.sm .zoom{display:none}
.grid.focus .cell.sm .vfail{font-size:10.5px;padding:8px}
@media (max-width:860px){.grid.focus{grid-template-columns:minmax(0,1fr) 104px}}

/* ---- 타임라인 보기 ----
   목록은 "무엇이 있나"를 보여 주고, 타임라인은 "언제 찍혔나"를 보여 준다.
   위에 시간 축, 아래에 고른 영상. 축 위의 블록 하나가 1분짜리 구간 하나다. */
.viewsw{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewsw[hidden]{display:none}
.viewsw button{height:36px;padding:0 13px;border:none;cursor:pointer;font-size:13px;
  background:var(--surface2);color:var(--muted)}
.viewsw button.on{background:color-mix(in srgb,var(--ok) 18%,var(--surface2));color:var(--ok)}
.body.tlview{grid-template-columns:1fr}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px 12px;display:flex;flex-direction:column;gap:9px;flex-shrink:0}
.tlhead{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tlhead .t{font-size:13px;font-weight:600}
.tlhead .sp{flex:1;min-width:8px}
.tlhead .note{font-size:11.5px;color:var(--muted)}
.tlscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:3px}
.tltrack{position:relative;min-width:100%}
.tlruler{position:relative;height:17px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tlruler .tk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tlruler .tk span{position:absolute;left:4px;top:0;font-size:10.5px;color:var(--muted);white-space:nowrap}
.tllane{position:relative;height:26px;margin-bottom:5px;border-radius:7px;background:var(--surface2)}
.tllane .nm{position:sticky;left:0;z-index:2;display:inline-block;font-size:10.5px;color:var(--muted);
  padding:5px 9px 5px 7px;border-radius:7px;pointer-events:none;
  background:linear-gradient(90deg,var(--surface2) 68%,transparent)}
.tllane.hit{cursor:pointer}
.tllane.hit:hover{box-shadow:inset 0 0 0 1px var(--faint)}
/* 1분은 하루 축에서 1~2px 이다. 블록마다 클릭을 받으면 서로 겹쳐 엉뚱한 분이 잡힌다.
   그래서 블록은 보여 주기만 하고, 클릭은 레인이 x 좌표로 받아 가장 가까운 분을 고른다. */
.tlblk{position:absolute;top:4px;bottom:4px;min-width:2px;border-radius:3px;
  background:var(--faint);border:0;pointer-events:none}
.tlblk.recent{background:var(--tl-idle)}
.tlblk.saved,.tlblk.sentry{background:var(--tl-event)}
/* 암호화는 색만으로 말하지 않는다 — 빗금을 같이 준다. 색약·흑백 출력에서도 갈린다. */
.tlblk.enc{background-color:var(--tl-dead);
  background-image:repeating-linear-gradient(45deg,
    rgba(255,255,255,.55) 0 2px,transparent 2px 5px)}
.ompin.enc{border-style:dashed;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 2px,transparent 2px 5px)}
.mploc.enc{opacity:.72}
.mploc .tm.enc{text-decoration:line-through;opacity:.6}
.tlblk.on{outline:2px solid var(--ink);outline-offset:1px;z-index:3}
/* 재생 위치는 상태가 아니다. 상태색(빨강)과 겹치지 않게 잉크색으로 긋는다. */
.tlnow{position:absolute;top:17px;bottom:0;width:2px;background:var(--ink);
  z-index:4;pointer-events:none;display:none}
.tlempty{font-size:12.5px;color:var(--muted);padding:8px 2px}

/* ---- 지도 보기 ----
   실제 거리 지도를 깔 수 없어(→ 브라우저 제약) 좌표만 상대 위치로 그린다.
   축척 막대와 격자를 같이 그려야 "얼마나 떨어진 곳인지"가 읽힌다. */
.mp{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 13px 12px;display:flex;flex-direction:column;gap:9px;flex-shrink:0}
.mphead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mphead .t{font-size:13px;font-weight:600}
.mphead .sp{flex:1;min-width:8px}
.mphead .note{font-size:11.5px;color:var(--muted)}
.mplg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
.mplg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mpbox{position:relative;height:min(44vh,400px);border-radius:11px;
  background:var(--surface2);overflow:hidden}
.mpbox svg{display:block;width:100%;height:100%}
.mpbox .gr{stroke:var(--line);stroke-width:1}
.mppin{cursor:pointer}
.mppin circle.d{stroke:var(--surface2);stroke-width:2}
.mppin:hover circle.d{stroke:var(--ink)}
.mppin text{font-size:11px;fill:var(--muted);paint-order:stroke;
  stroke:var(--surface2);stroke-width:3px;stroke-linejoin:round}
.mppin.on text{fill:var(--ink);font-weight:600}
.mppin text.n{font-size:10px;font-weight:700;fill:#fff;stroke:none}
.mpbox .sb{stroke:var(--faint);stroke-width:2}
.mpbox .sbt,.mpbox .nt{font-size:11px;fill:var(--muted)}
.mpempty{font-size:12.5px;color:var(--muted);padding:10px 2px;word-break:keep-all;line-height:1.7}
/* 지점마다 OSM 임베드를 하나씩. 타일을 우리가 받지 않으니 막히지 않는다. */
.mpgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(288px,1fr))}
.mploc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.mploc.on{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.mploc iframe{width:100%;height:182px;border:0;display:block;background:var(--surface2)}
.mploc .cap{padding:9px 11px 11px;border-top:1px solid var(--line);background:var(--surface)}
.mploc .cap .a{font-size:12.5px;color:var(--ink);word-break:keep-all;line-height:1.5}
.mploc .cap .b{font-size:11px;color:var(--muted);margin-top:4px}
.mploc .cap .b a{color:var(--info);text-decoration:none;margin-left:7px}
.mploc .tms{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mploc .tm{font-size:11.5px;padding:4px 9px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface2);color:var(--muted);cursor:pointer}
.mploc .tm:hover{border-color:var(--faint)}
.mploc .tm.on{border-color:var(--ok);color:var(--ok);font-weight:600;
  background:color-mix(in srgb,var(--ok) 12%,var(--surface2))}

/* ---- 한 장 지도 ----
   타일을 직접 붙여 슬리피 맵을 만든다. 라이브러리를 쓰지 않는 이유는
   이 파일이 CDN 없이 혼자 돌아야 하기 때문이다(file:// 로도 연다). */
.om{position:relative;height:min(56vh,520px);border-radius:12px;overflow:hidden;
  background:var(--surface2);touch-action:none;cursor:grab}
.om.drag{cursor:grabbing}
.om .tiles,.om .pins{position:absolute;inset:0}
.om .pins{pointer-events:none}
.om .tiles img{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}
.ompin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);
  width:17px;height:17px;border-radius:50%;border:2px solid #fff;padding:0;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.45);display:grid;place-items:center}
.ompin.big{width:23px;height:23px}
.ompin.on{box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 55%,transparent),0 1px 4px rgba(0,0,0,.45)}
.ompin b{font-size:10.5px;color:#fff;font-weight:700;line-height:1}
.ompin .lb{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
  font-size:11px;white-space:nowrap;color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);
  border-radius:6px;padding:1px 5px;pointer-events:none}
.omui{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:5px;z-index:3}
.omui button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink);cursor:pointer;
  display:grid;place-items:center;font-size:14px;line-height:1}
.omui button.wide{width:auto;padding:0 8px;font-size:10.5px;white-space:nowrap}
.omsb{position:absolute;left:10px;bottom:10px;z-index:3;font-size:10.5px;color:var(--ink);
  background:color-mix(in srgb,var(--surface) 82%,transparent);padding:2px 6px;border-radius:6px}
.omsb i{display:inline-block;height:5px;border:1px solid var(--faint);border-top:0;
  vertical-align:middle;margin-right:5px}
.omatt{position:absolute;right:6px;bottom:4px;z-index:3;font-size:10px;
  background:color-mix(in srgb,var(--surface) 78%,transparent);padding:1px 5px;border-radius:5px}
.omatt a{color:var(--muted);text-decoration:none}
.ombanner{background:color-mix(in srgb,var(--warn) 13%,var(--surface));
  border:1px solid color-mix(in srgb,var(--warn) 38%,var(--line));border-radius:11px;
  padding:10px 13px;font-size:12.5px;line-height:1.7;word-break:keep-all}
.ombanner b{color:var(--warn)}
.ombanner button{margin-left:8px}
.cell{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:0;cursor:zoom-in}
.cell.big{cursor:default}
.cell video{transition:transform .12s ease-out}
.cell.dragging video{transition:none}
.cell.big video{cursor:grab}
.cell.big.dragging video{cursor:grabbing}
.cell .zbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);
  display:none;gap:4px;align-items:center;z-index:3;
  background:rgba(0,0,0,.62);border-radius:11px;padding:4px 6px}
.cell.big .zbar{display:flex}
.cell .zbar button{width:28px;height:28px;border:none;border-radius:7px;
  background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center}
.cell .zbar button:hover{background:rgba(255,255,255,.26)}
.cell .zbar .lv{color:#fff;font-size:11.5px;min-width:46px;text-align:center;
  font-variant-numeric:tabular-nums;user-select:none}
.cell video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
.cell .tag{position:absolute;left:8px;top:8px;font-size:11px;padding:3px 8px;border-radius:7px;
  background:rgba(0,0,0,.6);color:#fff;pointer-events:none}
.cell .zoom{position:absolute;right:8px;top:8px;width:28px;height:28px;border-radius:8px;border:none;
  background:rgba(0,0,0,.55);color:#fff;cursor:pointer;display:grid;place-items:center}
/* .hide 는 더 쓰지 않는다. 크게 볼 때도 나머지를 오른쪽에 남긴다. */
.cell .vfail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:16px;font-size:12.5px;color:var(--muted);background:var(--surface2);word-break:keep-all}

.bar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px 14px}
.bar input[type=range]{flex:1;accent-color:var(--ok);min-width:60px}
.time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seekwrap{position:relative;flex:1;min-width:60px;display:flex;flex-direction:column;
  justify-content:center;padding-bottom:7px}
.seekwrap input[type=range]{width:100%;margin:0}
#abband{position:absolute;left:0;bottom:0;height:4px;border-radius:2px;
  background:var(--ok);pointer-events:none;display:none}
.pbtn .ab{font-size:13px;font-weight:700}
.abrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.abinfo{font-size:13px;flex:1;min-width:150px}
.abinfo b{font-variant-numeric:tabular-nums}
.btn svg{flex-shrink:0}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;gap:5px}
.savebox{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.savehead{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;margin-bottom:10px}
.savehead .note{font-weight:400}
.savegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.savebtn{display:grid;grid-template-columns:auto 1fr;gap:3px 9px;align-items:center;
  text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface2);cursor:pointer}
.savebtn:hover{border-color:var(--faint)}
.savebtn.go{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface2))}
.savebtn.go .l{color:var(--ok)}
.savebtn svg{grid-row:1/3}
.savebtn .l{font-size:13.5px;font-weight:600}
.savebtn .s{grid-column:2;font-size:11.5px;color:var(--muted)}
/* ---- 암호화: 안 되는 것은 아예 내린다 ----
   저장 상자는 그리지 않고, 목록 · 타임라인 · 지도에는 표시만 남긴다. */
.no{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 7px;border-radius:6px;
  background:color-mix(in srgb,var(--alert) 18%,var(--surface2));color:var(--alert);
  white-space:nowrap;font-weight:600;vertical-align:middle}
.savecams{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.savecams .note{margin-right:2px}
.modesw{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:10px}
/* display 를 직접 준 요소는 [hidden] 도 같이 써 줘야 한다. 세 번째 같은 실수. */
.modesw[hidden]{display:none}
.modebtn{border:none;background:transparent;color:var(--muted);font-size:12px;
  padding:5px 11px;cursor:pointer;white-space:nowrap}
.modebtn+.modebtn{border-left:1px solid var(--line)}
.modebtn.on{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:600}
.recbox .in .note+.p{margin-top:10px}

/* 재생 속도. 0.1 ~ 3 배. 구간이나 클립을 바꿔도 유지된다 —
   예전에는 막대를 다시 만들 때마다 1배로 돌아가 버렸다. */
const RATES = [0.1, 0.15, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
let rate = 1;

/* 구간 지정(A~B). 사건 전후 몇 초만 따로 뽑아 두고 싶을 때. */
let markA = null, markB = null, loopAB = false;
let recording = null;
let saveMode = 'stamp';      // 'stamp' = 시각 새겨 재인코딩, 'raw' = 원본 복사
// 저장물에는 촬영 시각과 위치를 언제나 새긴다. 신고할 때 그게 보여야 하고,
// 끄는 선택지를 두면 꺼 놓고 저장했다가 다시 하게 된다.
function setRate(r) {
  rate = Math.max(0.1, Math.min(3, Math.round(r * 100) / 100));
  vids.forEach(v => { v.playbackRate = rate; });
  const sel = document.getElementById('rate');
  if (sel) sel.value = String(rate);
  const lab = document.getElementById('ratelab');
  if (lab) lab.textContent = rate + 'x';
  LS.set('rate', rate);
}
/** 프리셋을 한 칸씩. 슬라이더보다 손이 덜 간다. */
function stepRate(dir) {
  const i = RATES.findIndex(x => Math.abs(x - rate) < 0.001);
  const j = i < 0
    ? RATES.findIndex(x => x > rate) + (dir > 0 ? 0 : -1)
    : i + dir;
  setRate(RATES[Math.max(0, Math.min(RATES.length - 1, j))]);
}

/**
 * 사건이 난 구간의 인덱스.
 * 폴더 이름과 파일 이름의 '초'가 달라서 문자열 일치로 찾으면 못 찾는다.
 * 사건 시각에 가장 가까운 구간을 고른다.
 */
function eventSegIndex(c) {
  if (!c.segments.length) return 0;
  const t = (c.event && Date.parse(c.event.timestamp)) || c.at;
  if (!t) return c.segments.length - 1;
  let best = 0, gap = Infinity;
  c.segments.forEach((sg, i) => {
    const d = Math.abs(sg.at - t);
    if (d < gap) { gap = d; best = i; }
  });
  return best;
}

/** 지금 보고 있는 구간. 기본은 사건이 일어난 그 분. */
function curSeg(c) {
  if (segPick[c.id] != null && c.segments[segPick[c.id]]) return c.segments[segPick[c.id]];
  return c.segments[eventSegIndex(c)];
}
const segIndex = c => c.segments.indexOf(curSeg(c));

/* ---------- 폴더 기억 ----------
   <input webkitdirectory> 로 고른 폴더는 새로고침하면 사라진다. File 객체를 저장할 수
   없기 때문이다. File System Access 로 고르면 핸들이 남고, 그 핸들은 IndexedDB 에
   저장했다가 다음에 다시 쓸 수 있다. 크롬이 권한을 한 번 더 묻지만 폴더를 다시
   찾아 들어갈 필요는 없다. 이 API 가 없는 브라우저는 예전처럼 input 을 쓴다. */
const ON_FILE = location.protocol === 'file:';
// file:// 에서는 크롬이 폴더 접근을 거부한다 — "이 폴더에는 시스템 파일이 포함되어
// 있으므로 file:/// 에서 열 수 없습니다". 폴더를 바꿔도 마찬가지다.
// 그래서 여기서는 기억 기능을 아예 내린다. teslacam-viewer.bat 로 열면 살아난다.
const HAS_FSA = typeof window.showDirectoryPicker === 'function' && !ON_FILE;

/** 보던 자리(필터·클립·구간·재생 위치)를 기억한다. 실패해도 동작에는 지장 없다. */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('tcv.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tcv.' + k, JSON.stringify(v)); } catch (e) {} },
};
let pendingSeek = 0;        // 복원할 재생 위치
let lastSave = 0;

function saveView() {
  if (!cur) return;
  LS.set('filter', filter);
  LS.set('clipId', cur.id);
  LS.set('segIdx', cur.segments.indexOf(curSeg(cur)));
  LS.set('time', master ? Math.max(0, master.currentTime - 1) : 0);
}

function idb() {
  return new Promise((res, rej) => {
    const q = indexedDB.open('teslacam-viewer', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv');
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbPut(k, v) {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  } catch (e) { /* 기억 못 해도 동작에는 지장 없다 */ }
}
async function idbGet(k) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const r = db.transaction('kv').objectStore('kv').get(k);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch (e) { return null; }
}

/** 핸들 트리를 걸어 {path, file} 목록으로. 파일이 많아 진행 상황을 보여 준다. */
async function collect(dir) {
  const out = [];
  let n = 0;
  async function walk(h, prefix) {
    for await (const [name, e] of h.entries()) {
      const path = prefix ? prefix + '/' + name : name;
      if (e.kind === 'directory') { await walk(e, path); continue; }
      if (!/\.(mp4|json|png)$/i.test(name)) continue;
      out.push({ path, file: await e.getFile() });
      if (++n % 200 === 0) { $('#sub').textContent = `읽는 중… ${n}개`; await new Promise(r => setTimeout(r)); }
    }
  }
  await walk(dir, dir.name);
  return out;
}

let dirHandle = null;

async function useHandle(h, ask) {
  const opt = { mode: 'read' };
  let st = await h.queryPermission(opt);
  if (st !== 'granted' && ask) st = await h.requestPermission(opt);
  if (st !== 'granted') return false;
  dirHandle = h;
  await idbPut('dir', h);
  $('#sub').textContent = '읽는 중…';
  await index(await collect(h));
  return true;
}

/** 2026-09-19_14-32-05 — 차량 현지 시각. UTC 로 읽으면 어긋난다. */
function stampAt(s) {
  const m = /^(\d{4})-(\d\d)-(\d\d)_(\d\d)-(\d\d)-(\d\d)$/.exec(s);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : 0;
}
/** 2026-09-19_14-32-05-front.mp4 -> ["2026-09-19_14-32-05", "front"] */
function split(name) {
  const b = name.replace(/\.mp4$/i, '');
  return b.length > 20 && b[19] === '-' ? [b.slice(0, 19), b.slice(20)] : null;
}
/** 정상 mp4 는 4~8 바이트가 'ftyp'. 아니면 암호화된 것으로 본다. */
async function isEncrypted(file) {
  try {
    const b = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    if (b.length < 12) return true;
    return !(b[4] === 0x66 && b[5] === 0x74 && b[6] === 0x79 && b[7] === 0x70);
  } catch (e) { return false; }
}

async function index(files) {
  $('#sub').textContent = '읽는 중…';
  const groups = new Map();

  for (const ent of files) {
    const f = ent.file;
    const parts = ent.path.split('/');
    const i = parts.findIndex(p => KIND[p]);
    if (i < 0) continue;
    const kind = KIND[parts[i]];
    const rest = parts.slice(i + 1);
    if (!rest.length) continue;

    // RecentClips 는 파일이 평평하게, 나머지는 타임스탬프 폴더 안에 들어 있다.
    const stamp = kind === 'recent' ? (split(rest[rest.length - 1]) || [])[0] : rest[0];
    if (!stamp) continue;

    const key = kind + ':' + stamp;
    if (!groups.has(key)) groups.set(key, { id: key, kind, stamp, at: stampAt(stamp), files: [], extras: [], event: null });
    const g = groups.get(key);

    const base = rest[rest.length - 1];
    if (/^event\.json$/i.test(base)) g.eventFile = f;
    else if (/\.mp4$/i.test(base)) {
      // 파일 이름마다 자기 타임스탬프가 붙어 있다. 저장·센트리 폴더에는
      // 사건 전후 10여 분이 1분짜리로 쪼개져 들어가므로, 그 분 단위로 다시 묶는다.
      // 이걸 안 하면 "카메라 45대" 같은 말이 안 되는 목록이 나온다.
      const sp = split(base);
      if (sp) g.files.push({ segStamp: sp[0], cam: sp[1], label: CAM_LABEL[sp[1]] || sp[1], file: f });
      // 이름 규칙에서 벗어난 mp4 는 따로 둔다. 구간으로 세면 재생 안 되는 빈 구간이
      // 하나 생기고, 폴더 이름과 스탬프가 같다는 이유로 그게 기본 선택이 되어 버린다.
      else g.extras.push({ name: base, file: f });
    }
  }

  const out = [];
  for (const g of groups.values()) {
    if (!g.files.length) continue;
    // 분 단위 구간으로 접는다. 구간 하나가 곧 카메라 4대짜리 1분 영상이다.
    const bySeg = new Map();
    for (const f of g.files) {
      if (!bySeg.has(f.segStamp)) bySeg.set(f.segStamp, []);
      bySeg.get(f.segStamp).push(f);
    }
    g.segments = [...bySeg.entries()]
      .map(([st, files]) => ({
        stamp: st,
        at: stampAt(st) || g.at,
        files: files.sort((a, b) => {
          const ai = CAM_ORDER.indexOf(a.cam), bi = CAM_ORDER.indexOf(b.cam);
          return (ai < 0 ? CAM_ORDER.length : ai) - (bi < 0 ? CAM_ORDER.length : bi)
            || a.cam.localeCompare(b.cam);
        }),
        bytes: files.reduce((s, x) => s + x.file.size, 0),
      }))
      .sort((a, b) => a.at - b.at);
    g.cams = Math.max(...g.segments.map(x => x.files.length));
    g.bytes = g.files.reduce((s, x) => s + x.file.size, 0);
    g.eventState = 'none';
    if (g.eventFile) {
      // 그냥 null 로 두면 "위치 없음" 이 파일이 없는 건지 못 읽은 건지 구분이 안 된다.
      try {
        const txt = await g.eventFile.text();
        const head = txt.replace(/^\uFEFF/, '').trimStart()[0];
        if (head !== '{') g.eventState = 'locked';          // JSON 이 아니다 — 암호화됐거나 깨졌다
        else { g.event = JSON.parse(txt.replace(/^\uFEFF/, '')); g.eventState = 'ok'; }
      } catch (e) { g.eventState = 'locked'; }
    }
    g.encrypted = await isEncrypted(g.segments[g.segments.length - 1].files[0].file);
    out.push(g);
  }

  /* RecentClips 는 1분짜리가 줄줄이 이어진다. 파일 하나를 클립 하나로 세면
     "07:10, 07:11, 07:12 …" 25줄이 된다. 끊김 없이 이어지는 것은 한 덩어리로 묶어
     "07:10 ~ 07:35" 한 줄로 보여 준다. 저장·센트리는 각각이 별개의 사건이라 묶지 않는다. */
  const GAP = 95000;                      // 1분 + 여유. 이보다 벌어지면 다른 덩어리다
  const runs = [];
  let run = null;
  out.filter(c => c.kind === 'recent').sort((a, b) => a.at - b.at).forEach(c => {
    const last = run && run.segments[run.segments.length - 1];
    // 암호화된 것과 아닌 것이 한 덩어리에 섞이면 재생도 설명도 엉킨다.
    if (run && c.at - last.at <= GAP && c.encrypted === run.encrypted) {
      run.segments.push(...c.segments);
      run.files.push(...c.files);
      run.extras.push(...c.extras);
      run.bytes += c.bytes;
      run.cams = Math.max(run.cams, c.cams);
    } else { run = c; runs.push(run); }
  });
  const kept = out.filter(c => c.kind !== 'recent').concat(runs);
  out.length = 0;
  out.push(...kept);

  out.sort((a, b) => b.at - a.at);
  CLIPS = out;
  cur = null;
  const enc = CLIPS.filter(c => c.encrypted).length;
  const ev = CLIPS.filter(c => c.eventState === 'ok').length;
  const lock = CLIPS.filter(c => c.eventState === 'locked').length;
  const noev = CLIPS.filter(c => c.eventState === 'none' && c.kind !== 'recent').length;
  $('#sub').textContent = CLIPS.length
    ? [`클립 ${CLIPS.length}개`,
       enc ? `영상 암호화 ${enc}개` : null,
       `위치 ${ev}개`,
       lock ? `event.json 잠김 ${lock}개` : null,
       noev ? `event.json 없음 ${noev}개` : null].filter(Boolean).join(' · ')
    : 'TeslaCam 폴더를 찾지 못했습니다';
  $('#viewsw').hidden = !CLIPS.length;
  document.querySelectorAll('#viewsw button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#body').classList.toggle('tlview', view !== 'list' && !!CLIPS.length);
  $('#side').hidden = !CLIPS.length || view !== 'list';
  $('#body').classList.toggle('noside', $('#side').hidden);
  tlDay = null;
  tileFail = false;
  // 새로고침 전에 보던 자리로 돌아간다.
  filter = LS.get('filter', 'all');
  drawFilters();
  drawList();
  if (CLIPS.length) {
    const want = CLIPS.filter(c => c.id === LS.get('clipId'))[0];
    if (want) {
      const si = LS.get('segIdx', -1);
      if (si >= 0 && want.segments[si]) segPick[want.id] = si;
      pendingSeek = LS.get('time', 0) || 0;
      select(want);
    } else {
      select(CLIPS.filter(c => !c.encrypted)[0] || CLIPS[0]);
    }
  } else drawEmpty();
}

/* ---------- 목록 ---------- */

function drawFilters() {
  const counts = { all: CLIPS.length };
  CLIPS.forEach(c => counts[c.kind] = (counts[c.kind] || 0) + 1);
  const f = $('#filters');
  f.innerHTML = '';
  const choices = [
    ['all', '전체', '지원하는 모든 영상'],
    ['sentry', '센트리', '주차 중 센트리 모드가 감지해 저장한 영상'],
    ['saved', '저장', '화면·아이콘·경적 등으로 보존한 영상'],
    ['recent', '상시', '주행 중 순환 저장된 최근 영상 · 위치 정보 없음']
  ];
  choices.forEach(([k, label, title]) => {
    if (k !== 'all' && !counts[k]) return;
    const b = document.createElement('button');
    b.className = 'chip' + (filter === k ? ' on' : '');
    b.textContent = `${label} ${counts[k] || 0}`;
    b.title = title;
    b.onclick = () => { filter = k; LS.set('filter', filter); drawFilters(); drawList(); };
    f.append(b);
  });
}

function fmtWhen(t) {
  if (!t) return '시각 미상';
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  const wd = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${wd}) ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
const mb = n =>
  n >= (1 << 30) ? (n / (1 << 30)).toFixed(1) + ' GB'
  : n >= (1 << 20) ? Math.round(n / (1 << 20)) + ' MB'
  : Math.max(1, Math.round(n / 1024)) + ' KB';

function place(c) {
  const e = c.event;
  if (!e) return null;
  const g = geoOf(c);
  if (!g) return e.city || null;
  if (g.addr) return g.addr;                       // 주소를 받아왔으면 주소로
  return e.city || addrText(g) || null;
}

/** 위치가 없을 때 그 이유. "없음" 만 보여주면 암호화 탓인지 원래 없는 건지 알 수 없다. */
function whyNoPlace(c) {
  if (c.eventState === 'locked') return 'event.json 을 읽지 못했습니다 (암호화되었거나 깨짐)';
  if (c.eventState === 'none')
    return c.kind === 'recent'
      ? 'RecentClips 에는 event.json 이 없습니다 — 테슬라가 위치를 기록하지 않습니다'
      : '이 폴더에 event.json 이 없습니다';
  return 'event.json 에 좌표(est_lat / est_lon)가 없습니다';
}
function reasonOf(c) {
  const r = c.event && c.event.reason;
  return typeof r === 'string' && r.trim() ? r.trim() : null;
}
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function eventLabel(c) {
  const reason = reasonOf(c);
  if (reason) return REASON[reason] || '기타 이벤트';
  if (c.kind === 'recent') return '주행 녹화';
  return c.eventState === 'locked' ? '사유 확인 불가' : '사유 미기록';
}
/** 목록·지도에는 실제 reason 값이 있을 때만 이벤트 이름을 보여 준다. */
function visibleEventName(c) {
  return reasonOf(c) ? eventLabel(c) : '';
}
function eventDetail(c) {
  const reason = reasonOf(c);
  if (reason) return REASON[reason] ? reason : '기록된 사유: ' + reason;
  if (c.kind === 'recent') return '상시 녹화 영상입니다.';
  return c.eventState === 'locked'
    ? 'event.json을 읽을 수 없어 저장 사유를 확인할 수 없습니다.'
    : '저장 사유가 기록되지 않았습니다. 영상에서 상황을 확인해 주세요.';
}

/* ---------- 타임라인 ----------
   목록만 있으면 "그날 몇 시에 무엇이 찍혔는지"가 한눈에 안 들어온다.
   하루치를 시간 축에 펼쳐 놓고, 블록을 누르면 아래에서 그 1분이 재생된다. */

const hhmm = t => { const d = new Date(t), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes()); };
const dayKey = t => { const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
function dayLabel(k) {
  const [y, m, d] = k.split('-').map(Number);
  const wd = ['일', '월', '화', '수', '목', '금', '토'][new Date(y, m - 1, d).getDay()];
  return `${m}월 ${d}일 (${wd})`;
}

/** 모든 클립의 모든 구간을 시간순으로 편 것. 타임라인은 이것을 그린다. */
function allSegs() {
  const out = [];
  CLIPS.forEach(c => (c.segments || []).forEach((sg, i) => {
    if (sg.at) out.push({ clip: c, i, at: sg.at, kind: c.kind, cams: (sg.files || []).length });
  }));
  return out.sort((a, b) => a.at - b.at);
}

const VIEWS = ['timeline', 'list', 'map'];

function setViewMode(v) {
  if (!VIEWS.includes(v) || view === v) return;
  view = v;
  LS.set('view', v);
  // 보던 자리를 잃지 않도록 재생 위치를 넘겨 준다.
  if (master) pendingSeek = master.currentTime;
  applyView();
}

function applyView() {
  document.querySelectorAll('#viewsw button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#viewsw').hidden = !CLIPS.length;
  $('#body').classList.toggle('tlview', view !== 'list' && !!CLIPS.length);
  $('#side').hidden = !CLIPS.length || view !== 'list';
  $('#body').classList.toggle('noside', $('#side').hidden);
  if (!CLIPS.length) return;
  if (cur) select(cur); else drawEmpty();
}

/** 배율이나 날짜만 바뀌었을 때. 영상은 건드리지 않고 띠만 다시 그린다. */
function redrawTimeline() {
  const old = document.querySelector('.tl');
  if (old) old.replaceWith(timelineStrip());
}

const TL_STEPS = [60e3, 2 * 60e3, 5 * 60e3, 10 * 60e3, 15 * 60e3, 30 * 60e3,
                  3600e3, 2 * 3600e3, 3 * 3600e3, 6 * 3600e3];

function timelineStrip() {
  const box = document.createElement('div');
  box.className = 'tl';
  const segs = allSegs();
  if (!segs.length) {
    box.innerHTML = '<div class="tlempty">시각을 읽을 수 있는 영상이 없어 타임라인을 그릴 수 없습니다.</div>';
    return box;
  }

  const days = [...new Set(segs.map(x => dayKey(x.at)))].sort();
  if (!days.includes(tlDay)) {
    const want = cur && cur.at ? dayKey(cur.at) : null;
    tlDay = days.includes(want) ? want : days[days.length - 1];
  }
  const mine = segs.filter(x => dayKey(x.at) === tlDay);

  const HOUR = 3600e3;
  const t0 = Math.floor(Math.min(...mine.map(x => x.at)) / HOUR) * HOUR;
  let t1 = Math.ceil(Math.max(...mine.map(x => x.at + SEG_MS)) / HOUR) * HOUR;
  if (t1 - t0 < HOUR) t1 = t0 + HOUR;
  const span = t1 - t0;
  box._t0 = t0; box._span = span; box._day = tlDay;

  /* --- 머리줄: 날짜와 배율 --- */
  const head = document.createElement('div');
  head.className = 'tlhead';
  const ttl = document.createElement('span');
  ttl.className = 't';
  ttl.textContent = '타임라인';
  head.append(ttl);
  if (days.length > 1) {
    days.forEach(k => {
      const b = document.createElement('button');
      b.className = 'chip' + (k === tlDay ? ' on' : '');
      b.textContent = dayLabel(k);
      b.title = k;
      b.onclick = () => { tlDay = k; tlScroll = 0; redrawTimeline(); };
      head.append(b);
    });
  } else {
    const d = document.createElement('span');
    d.className = 'note';
    d.textContent = dayLabel(tlDay);
    head.append(d);
  }
  const sp = document.createElement('span');
  sp.className = 'sp';
  const note = document.createElement('span');
  note.className = 'note';
  note.textContent = `${hhmm(t0)} ~ ${hhmm(t1)} · 블록 하나가 1분`;
  head.append(sp, note);

  // 자리(레인)는 종류를 말하고, 색은 상태를 말한다. 무슨 뜻인지 여기 적어 둔다.
  const has = {
    idle: mine.some(x => x.kind === 'recent' && !x.clip.encrypted),
    event: mine.some(x => x.kind !== 'recent' && !x.clip.encrypted),
    dead: mine.some(x => x.clip.encrypted),
  };
  [['idle', '상시', 'var(--tl-idle)', ''],
   ['event', '사건', 'var(--tl-event)', ''],
   ['dead', '재생 불가', 'var(--tl-dead)',
    ';background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 4px)']
  ].forEach(([k, label, col, extra]) => {
    if (!has[k]) return;
    const l = document.createElement('span');
    l.className = 'mplg';
    l.innerHTML = `<i style="background:${col}${extra}"></i>${label}`;
    head.append(l);
  });

  [1, 2, 4, 8].forEach(z => {
    const b = document.createElement('button');
    b.className = 'chip' + (tlZoom === z ? ' on' : '');
    b.textContent = '×' + z;
    b.title = z === 1 ? '하루치를 한 화면에' : `가로로 ${z}배 늘려 보기 (좌우로 밀어서)`;
    b.onclick = () => { tlZoom = z; redrawTimeline(); };
    head.append(b);
  });
  box.append(head);

  /* --- 축과 레인 --- */
  const scroll = document.createElement('div');
  scroll.className = 'tlscroll';
  const track = document.createElement('div');
  track.className = 'tltrack';
  track.style.width = (tlZoom * 100) + '%';

  const ruler = document.createElement('div');
  ruler.className = 'tlruler';
  track.append(ruler);

  const LANES = [['sentry', '센트리 이벤트'], ['saved', '저장 이벤트'], ['recent', '상시 녹화']];
  LANES.forEach(([kind, label]) => {
    const rows = mine.filter(x => x.kind === kind);
    if (!rows.length) return;
    const lane = document.createElement('div');
    lane.className = 'tllane';
    // 빗금이 무슨 뜻인지 레인 이름 옆에 적어 둔다.
    const nEnc = rows.filter(x => x.clip.encrypted).length;
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.innerHTML = label + (nEnc
      ? ` <span style="color:var(--alert)">🔒 ${nEnc === rows.length ? '전부' : nEnc + '개'} 암호화</span>`
      : '');
    lane.append(nm);
    rows.forEach(x => {
      const on = cur && cur.id === x.clip.id && segIndex(x.clip) === x.i;
      const b = document.createElement('div');
      b.className = 'tlblk ' + kind + (on ? ' on' : '') + (x.clip.encrypted ? ' enc' : '');
      b.style.left = ((x.at - t0) / span * 100) + '%';
      b.style.width = (SEG_MS / span * 100) + '%';
      lane.append(b);
    });

    /** 레인 위 x 좌표에 가장 가까운 분. */
    const pick = ev => {
      const r = lane.getBoundingClientRect();
      const t = t0 + Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * span;
      let best = rows[0], gap = Infinity;
      rows.forEach(x => { const d = Math.abs(x.at + SEG_MS / 2 - t); if (d < gap) { gap = d; best = x; } });
      return best;
    };
    lane.classList.add('hit');
    let hint = null;
    lane.onmousemove = ev => {
      const x = pick(ev);
      if (x === hint) return;
      hint = x;
      lane.title = `${hhmm(x.at)}${visibleEventName(x.clip) ? ' · ' + visibleEventName(x.clip) : ''} · 카메라 ${x.cams}대`
        + (x.clip.encrypted
            ? ' · 🔒 암호화 — 재생 · 저장 불가 (눌러서 이유 보기)'
            : ' — 눌러서 재생');
    };
    lane.onclick = ev => {
      const x = pick(ev);
      tlScroll = scroll.scrollLeft;
      segPick[x.clip.id] = x.i;
      pendingSeek = 0;
      select(x.clip);
    };
    track.append(lane);
  });

  const now = document.createElement('div');
  now.className = 'tlnow';
  track.append(now);

  scroll.append(track);
  scroll.onscroll = () => { tlScroll = scroll.scrollLeft; };
  box.append(scroll);

  /* --- 눈금은 실제 너비를 재고 나서 그린다. 너무 촘촘하면 글자가 겹친다. --- */
  function drawRuler() {
    const w = track.getBoundingClientRect().width || 900;
    const step = TL_STEPS.find(x => x / span * w >= 62) || TL_STEPS[TL_STEPS.length - 1];
    ruler.innerHTML = '';
    for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) {
      const k = document.createElement('div');
      k.className = 'tk';
      k.style.left = ((t - t0) / span * 100) + '%';
      k.innerHTML = '<span>' + hhmm(t) + '</span>';
      ruler.append(k);
    }
  }
  requestAnimationFrame(() => {
    drawRuler();
    // 고른 블록이 화면 밖이면 끌어다 놓는다.
    const on = track.querySelector('.tlblk.on');
    if (on) {
      const r = on.getBoundingClientRect(), sr = scroll.getBoundingClientRect();
      if (r.left < sr.left || r.right > sr.right) scroll.scrollLeft += r.left - sr.left - sr.width / 2;
      else scroll.scrollLeft = tlScroll;
    } else scroll.scrollLeft = tlScroll;
    tlScroll = scroll.scrollLeft;
  });
  if (window.ResizeObserver) new ResizeObserver(drawRuler).observe(track);

  return box;
}

/* ---------- 지도 보기 ----------
   좌표가 있는 클립을 상대 위치로 찍는다. 실제 거리 지도는 깔 수 없다 —
   OSM 타일 서버는 신원이 확인되는 앱만 받는다(→ 403). 그래서 격자와 축척 막대를
   같이 그려 "여기서 얼마나 떨어진 곳인지"를 읽을 수 있게 했다.
   고른 지점의 진짜 거리 지도는 아래 정보 카드의 OpenStreetMap 이 보여 준다. */

const SVGNS = 'http://www.w3.org/2000/svg';
const el = (n, at) => { const e = document.createElementNS(SVGNS, n);
  for (const k in at) e.setAttribute(k, at[k]); return e; };
const NICE_M = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000];
/** 타임라인과 같은 어휘를 쓴다. 화면마다 색 뜻이 다르면 둘 다 못 읽는다. */
const pinFill = enc => enc ? 'var(--tl-dead)' : 'var(--tl-event)';

const fmtDist = m => m >= 1000 ? (m / 1000 >= 10 ? Math.round(m / 1000) : (m / 1000).toFixed(1)) + ' km'
                               : Math.round(m) + ' m';

/* ---------- 한 장 지도 ----------
   지점별 카드로는 "서로 얼마나 떨어져 있나" 가 안 보인다. 한 장에 다 찍으려면
   타일이 필요한데, OSM 임베드는 마커를 하나만 받는다. 그래서 타일을 직접 붙인다.
   라이브러리는 쓰지 않는다 — 이 파일은 CDN 없이 file:// 로도 열려야 한다.

   다만 OSM 타일 서버는 file:// 에서 온 요청(Referer 없음)을 403 으로 막는다.
   그래서 실패를 세다가 한 장도 못 받으면 좌표 그림으로 내려가고, 왜인지 적어 준다.
   http://localhost (teslacam-viewer.bat) 로 열면 Referer 가 붙어 받아진다. */

/* 지도는 날짜를 가리지 않는다 — 좌표가 있는 클립이면 며칠치든 다 올린다.
   그래서 점 옆에 시각만 적으면 "그날 것만 있나" 로 읽힌다. 날짜가 섞여 있으면 날짜까지 적는다. */
const daysOf = pts => new Set(pts.map(x => dayKey(x.c.at))).size;
function shortWhen(t, withDay, sec) {
  const d = new Date(t), p = n => String(n).padStart(2, '0');
  const hm = `${p(d.getHours())}:${p(d.getMinutes())}` + (sec ? ':' + p(d.getSeconds()) : '');
  return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${hm}`;
}

const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_SZ = 256, Z_MIN = 3, Z_MAX = 18;
const prX = lo => (lo + 180) / 360;
const prY = la => { const s = Math.sin(la * Math.PI / 180);
  return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
const unY = y => 360 / Math.PI * Math.atan(Math.exp((0.5 - y) * 2 * Math.PI)) - 90;

let mapPos = null;     // {cx, cy, z} 정규화 좌표. 클립을 바꿔도 보던 자리를 지킨다
let tileFail = false;  // 타일을 한 장도 못 받았다


let connectMapPoints = LS.get('connectMapPoints', true);
function mapConnections(pts) {
  const byId = new Map(pts.map(p => [p.c.id,p]));
  const ordered = [...CLIPS].sort((a,b)=>a.at-b.at);
  const edges=[];
  for(let i=1;i<ordered.length;i++) {
    const a=byId.get(ordered[i-1].id), b=byId.get(ordered[i].id);
    if(!a || !b)continue;
    const gap=b.c.at-a.c.at;
    if(gap<=0 || gap>30*60*1000)continue;
    if(Math.abs(a.g.la-b.g.la)<.00001 && Math.abs(a.g.lo-b.g.lo)<.00001)continue;
    edges.push([a,b]);
  }
  return edges;
}
function routeLayer(pts, project) {
  const group=el('g',{class:'map-route','pointer-events':'none'});
  if(!connectMapPoints)return group;
  for(const [a,b] of mapConnections(pts)) {
    const [x1,y1]=project(a),[x2,y2]=project(b);
    if(![x1,y1,x2,y2].every(Number.isFinite))continue;
    const line=el('line',{x1,y1,x2,y2,stroke:'var(--ok)','stroke-width':2.5,'stroke-dasharray':'6 5',opacity:.8});
    group.append(line);
    const len=Math.hypot(x2-x1,y2-y1);
    if(len>24) {
      const x=x1+(x2-x1)*.65,y=y1+(y2-y1)*.65,angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
      group.append(el('path',{d:'M -6 -4 L 0 0 L -6 4',fill:'none',stroke:'var(--ok)','stroke-width':2.5,transform:'translate('+x+' '+y+') rotate('+angle+')'}));
    }
  }
  return group;
}

function oneMap(pts) {
  const spots = spotsOf(pts);
  const withDay = daysOf(pts) > 1;

  const om = document.createElement('div');
  om.className = 'om';
  om.title = '끌어서 이동 · 휠로 확대 · Shift+휠은 페이지 스크롤';

  const pins = document.createElement('div');
  pins.className = 'pins';

  const ui = document.createElement('div');
  ui.className = 'omui';
  const mk = (t, title, fn) => { const b = document.createElement('button');
    b.textContent = t; b.title = title; b.onclick = e => { e.stopPropagation(); fn(); }; return b; };
  ui.append(mk('+', '확대', () => zoomBy(1)), mk('−', '축소', () => zoomBy(-1)),
            Object.assign(mk('전체', '모든 지점이 보이게', () => { fit(); render(); }), { className: 'wide' }));
  om.append(ui);

  const sb = document.createElement('div');
  sb.className = 'omsb';
  om.append(sb);
  const att = document.createElement('div');
  att.className = 'omatt';
  att.innerHTML = '<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap 기여자</a>';
  om.append(att);

  /* --- 시야 --- */
  function size() { const r = om.getBoundingClientRect(); return { w: r.width || 900, h: r.height || 420 }; }

  function fit() {
    const { w, h } = size();
    const xs = spots.map(q => prX(q.lo)), ys = spots.map(q => prY(q.la));
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pad = 70;
    let z = Z_MAX;
    if (x1 > x0 || y1 > y0) {
      const zx = Math.log2(Math.max(1, w - pad) / Math.max(1e-9, (x1 - x0) * TILE_SZ));
      const zy = Math.log2(Math.max(1, h - pad) / Math.max(1e-9, (y1 - y0) * TILE_SZ));
      z = Math.floor(Math.min(zx, zy));
    } else z = 16;                                  // 한 지점뿐이면 적당히 가깝게
    mapPos = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, z: Math.max(Z_MIN, Math.min(Z_MAX, z)) };
  }
  if (!mapPos) fit();

  function zoomBy(d, ax, ay) {
    const { w, h } = size();
    const z2 = Math.max(Z_MIN, Math.min(Z_MAX, mapPos.z + d));
    if (z2 === mapPos.z) return false;
    const ws = TILE_SZ * Math.pow(2, mapPos.z), ws2 = TILE_SZ * Math.pow(2, z2);
    const dx = (ax == null ? w / 2 : ax) - w / 2, dy = (ay == null ? h / 2 : ay) - h / 2;
    const ux = mapPos.cx + dx / ws, uy = mapPos.cy + dy / ws;
    mapPos = { cx: ux - dx / ws2, cy: uy - dy / ws2, z: z2 };
    render();
    return true;
  }

  /* --- 타일 --- */
  const live = new Map();          // 'z/x/y' -> img. 다시 그릴 때 있는 것은 그대로 둔다
  let okCount = 0, badCount = 0;

  function drawTiles(w, h, ws) {
    const n = Math.pow(2, mapPos.z);
    const left = mapPos.cx * ws - w / 2, top = mapPos.cy * ws - h / 2;
    const x0 = Math.floor(left / TILE_SZ), x1 = Math.floor((left + w) / TILE_SZ);
    const y0 = Math.floor(top / TILE_SZ), y1 = Math.floor((top + h) / TILE_SZ);
    const want = new Set();
    for (let ty = y0; ty <= y1; ty++) {
      if (ty < 0 || ty >= n) continue;
      for (let tx = x0; tx <= x1; tx++) {
        const wx = ((tx % n) + n) % n;             // 날짜변경선을 넘어가도 이어지게
        const key = `${mapPos.z}/${wx}/${ty}/${tx}`;
        want.add(key);
        let img = live.get(key);
        if (!img) {
          img = new Image();
          img.alt = '';
          img.decoding = 'async';
          img.referrerPolicy = 'strict-origin-when-cross-origin';
          img.onload = () => { okCount++; };
          img.onerror = () => {
            badCount++;
            // 한 장도 못 받았는데 실패만 쌓이면 타일이 막힌 것이다.
            if (!tileFail && okCount === 0 && badCount >= 3) { tileFail = true; redrawMap(); }
          };
          img.src = TILE_URL.replace('{z}', mapPos.z).replace('{x}', wx).replace('{y}', ty);
          live.set(key, img);
          tiles.append(img);
        }
        img.style.left = Math.round(tx * TILE_SZ - left) + 'px';
        img.style.top = Math.round(ty * TILE_SZ - top) + 'px';
      }
    }
    live.forEach((img, k) => { if (!want.has(k)) { img.remove(); live.delete(k); } });
  }

  /* --- 핀 --- */
  function drawPins(w, h, ws) {
    pins.innerHTML = '';
    const placed = [];
    spots.forEach(q => {
      const sx = w / 2 + (prX(q.lo) - mapPos.cx) * ws;
      const sy = h / 2 + (prY(q.la) - mapPos.cy) * ws;
      if (sx < -40 || sy < -40 || sx > w + 40 || sy > h + 40) return;
      // 화면에서 붙어 버리면 하나로 묶는다. 배율을 올리면 다시 갈라진다.
      const near = placed.find(g => Math.abs(g.sx - sx) < 24 && Math.abs(g.sy - sy) < 24);
      if (near) { near.list.push(...q.list); return; }
      placed.push({ sx, sy, list: [...q.list], g: q.g, la: q.la, lo: q.lo });
    });
    placed.forEach(g => {
      g.list.sort((a, b) => b.c.at - a.c.at);
      const on = cur && g.list.some(x => x.c.id === cur.id);
      const allEnc = g.list.every(x => x.c.encrypted);
      const b = document.createElement('button');
      b.className = 'ompin' + (g.list.length > 1 ? ' big' : '') + (on ? ' on' : '')
        + (allEnc ? ' enc' : '');
      b.style.left = g.sx + 'px';
      b.style.top = g.sy + 'px';
      b.style.background = pinFill(allEnc);
      if (g.list.length > 1) b.innerHTML = `<b>${g.list.length}</b>`;
      // 묶인 것도 이름표를 단다. 숫자만 있으면 언제 것인지 짐작할 수가 없다.
      const shown = (cur && g.list.find(x => x.c.id === cur.id)) || g.list[0];
      const lb = document.createElement('span');
      lb.className = 'lb';
      lb.textContent = shortWhen(shown.c.at, withDay)
        + (g.list.length > 1 && !on ? ` 외 ${g.list.length - 1}` : '');
      b.append(lb);
      b.title = g.list.map(x => fmtWhen(x.c.at) + (visibleEventName(x.c) ? ' · ' + visibleEventName(x.c) : '') + (x.c.encrypted ? ' 🔒 암호화' : '')).join('\n')
        + '\n' + (addrText(g.g) || '주소 확인 불가')
        + (allEnc ? '\n재생 · 저장 불가 (눌러서 이유 보기)'
          : g.list.length > 1 ? '\n눌러서 하나씩 넘겨봅니다' : '\n눌러서 재생');
      b.onclick = e => {
        e.stopPropagation();
        const i = cur ? g.list.findIndex(x => x.c.id === cur.id) : -1;
        pendingSeek = 0;
        select(g.list[(i + 1) % g.list.length].c);
      };
      pins.append(b);
    });
  }

  function drawScale(ws) {
    const la = unY(mapPos.cy);
    const mPerPx = 156543.03392 * Math.cos(la * Math.PI / 180) / Math.pow(2, mapPos.z);
    const d = NICE_M.find(x => x / mPerPx >= 56) || NICE_M[NICE_M.length - 1];
    sb.innerHTML = `<i style="width:${Math.round(d / mPerPx)}px"></i>${fmtDist(d)}`;
  }

  let first = true;
  function render() {
    const { w, h } = size();
    if (w < 40) return;
    let ws = TILE_SZ * Math.pow(2, mapPos.z);
    // 지난번 보던 자리가 이 USB 와 상관없는 곳이면(다른 지역) 다시 맞춘다.
    if (first) {
      first = false;
      const seen = spots.some(q => {
        const sx = w / 2 + (prX(q.lo) - mapPos.cx) * ws, sy = h / 2 + (prY(q.la) - mapPos.cy) * ws;
        return sx > -20 && sy > -20 && sx < w + 20 && sy < h + 20;
      });
      if (!seen) { fit(); ws = TILE_SZ * Math.pow(2, mapPos.z); }
    }
    drawTiles(w, h, ws);
    route.setAttribute('viewBox', '0 0 '+w+' '+h);
    route.replaceChildren(routeLayer(pts,p=>[w/2+(prX(p.g.lo)-mapPos.cx)*ws,h/2+(prY(p.g.la)-mapPos.cy)*ws]));
    drawPins(w, h, ws);
    drawScale(ws);
  }

  /* --- 조작 --- */
  let down = null, moved = false;
  om.addEventListener('pointerdown', e => {
    if (e.target.closest('.omui, .ompin, .omatt')) return;
    down = { x: e.clientX, y: e.clientY, cx: mapPos.cx, cy: mapPos.cy };
    moved = false;
    om.classList.add('drag');
    om.setPointerCapture(e.pointerId);
  });
  om.addEventListener('pointermove', e => {
    if (!down) return;
    const ws = TILE_SZ * Math.pow(2, mapPos.z);
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    mapPos.cx = down.cx - dx / ws;
    mapPos.cy = Math.max(0, Math.min(1, down.cy - dy / ws));
    render();
  });
  const up = e => { if (!down) return; down = null; om.classList.remove('drag');
    try { om.releasePointerCapture(e.pointerId); } catch (x) {} saveMapPos(); };
  om.addEventListener('pointerup', up);
  om.addEventListener('pointercancel', up);
  om.addEventListener('dblclick', e => {
    const r = om.getBoundingClientRect();
    zoomBy(1, e.clientX - r.left, e.clientY - r.top);
    saveMapPos();
  });
  om.addEventListener('wheel', e => {
    if (e.shiftKey) return;                       // 영상과 같은 약속: Shift 면 페이지 스크롤
    const zin = e.deltaY < 0;
    if ((zin && mapPos.z >= Z_MAX) || (!zin && mapPos.z <= Z_MIN)) return;   // 끝이면 양보
    e.preventDefault();
    const r = om.getBoundingClientRect();
    zoomBy(zin ? 1 : -1, e.clientX - r.left, e.clientY - r.top);
    saveMapPos();
  }, { passive: false });

  requestAnimationFrame(render);
  if (window.ResizeObserver) new ResizeObserver(render).observe(om);
  return om;
}

function saveMapPos() { if (mapPos) LS.set('mapPos', mapPos); }

/** 좌표가 같은 것들을 한 지점으로 묶는다. 집 앞 센트리는 늘 같은 자리다. */
function spotsOf(pts) {
  const out = [];
  pts.forEach(x => {
    const k = geoKey(x.g.la, x.g.lo);
    let q = out.find(y => y.k === k);
    if (!q) { q = { k, la: x.g.la, lo: x.g.lo, g: x.g, list: [] }; out.push(q); }
    q.list.push(x);
  });
  out.forEach(q => q.list.sort((a, b) => b.c.at - a.c.at));
  return out.sort((a, b) => b.list[0].c.at - a.list[0].c.at);
}

/**
 * 지점마다 OSM 임베드를 하나씩 놓는다.
 * 타일을 우리가 직접 받으면 403 이지만, 임베드는 osm.org 가 자기 이름으로 받아오므로 뜬다.
 * 그래서 "한 장에 여러 핀" 대신 "지점마다 한 장" 으로 간다.
 */
const MP_MAX = 24;
function realGrid(pts) {
  const wrap = document.createElement('div');
  const spots = spotsOf(pts);
  const withDay = daysOf(pts) > 1;
  const g = document.createElement('div');
  g.className = 'mpgrid';
  spots.slice(0, MP_MAX).forEach(q => {
    const allEnc = q.list.every(x => x.c.encrypted);
    const card = document.createElement('div');
    card.className = 'mploc' + (cur && q.list.some(x => x.c.id === cur.id) ? ' on' : '')
      + (allEnc ? ' enc' : '');
    const d = 0.0035;                       // 대략 400m 남짓
    const bbox = [q.lo - d, q.la - d * 0.7, q.lo + d, q.la + d * 0.7].map(v => v.toFixed(6)).join(',');
    const f = document.createElement('iframe');
    f.loading = 'lazy';
    f.referrerPolicy = 'no-referrer-when-downgrade';
    f.src = 'https://www.openstreetmap.org/export/embed.html'
      + `?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${q.la}%2C${q.lo}`;
    f.title = (addrText(q.g) || '주소 확인 불가') + ' 지도';

    const cap = document.createElement('div');
    cap.className = 'cap';
    const a1 = document.createElement('div');
    a1.className = 'a';
    a1.textContent = addrText(q.g) || '주소 확인 불가';
    const b1 = document.createElement('div');
    b1.className = 'b';
    const kinds = [...new Set(q.list.map(x => visibleEventName(x.c)).filter(Boolean))].join(' · ');
    b1.innerHTML = `${kinds ? kinds + ' · ' : ''}${q.list.length}건`
      + (allEnc ? ' · <span style="color:var(--alert)">🔒 재생 불가</span>' : '')
      + `<a href="https://www.openstreetmap.org/?mlat=${q.la}&mlon=${q.lo}#map=17/${q.la}/${q.lo}" target="_blank" rel="noopener">크게 보기</a>`
      + `<a href="https://map.kakao.com/link/map/촬영지점,${q.la},${q.lo}" target="_blank" rel="noopener">카카오맵</a>`;
    const tms = document.createElement('div');
    tms.className = 'tms';
    q.list.forEach(x => {
      const t = document.createElement('button');
      t.className = 'tm' + (cur && cur.id === x.c.id ? ' on' : '') + (x.c.encrypted ? ' enc' : '');
      t.textContent = shortWhen(x.c.at, withDay, true) + (visibleEventName(x.c) ? ' · ' + visibleEventName(x.c) : '');
      t.title = fmtWhen(x.c.at) + (visibleEventName(x.c) ? ' · ' + visibleEventName(x.c) : '')
        + (x.c.encrypted ? ' · 🔒 암호화 — 재생 · 저장 불가 (눌러서 이유 보기)' : ' — 눌러서 재생');
      t.onclick = () => { pendingSeek = 0; select(x.c); };
      tms.append(t);
    });
    cap.append(a1, b1, tms);
    card.append(f, cap);
    g.append(card);
  });
  wrap.append(g);

  const foot = document.createElement('div');
  foot.className = 'mpempty mpfoot';
  foot.style.padding = '9px 2px 0';
  foot.textContent = (spots.length > MP_MAX ? `지점 ${spots.length}곳 중 최근 ${MP_MAX}곳만 그립니다. ` : '')
    + '지도는 OpenStreetMap 에서 받아옵니다. 좌표만 나가고 영상은 나가지 않습니다.';
  wrap.append(foot);
  return wrap;
}

function redrawMap() {
  const old = document.querySelector('.mp');
  if (old) old.replaceWith(mapStrip());
}

function mapStrip() {
  const box = document.createElement('div');
  box.className = 'mp';

  const head = document.createElement('div');
  head.className = 'mphead';
  const ttl = document.createElement('span');
  ttl.className = 't';
  ttl.textContent = '지도';
  head.append(ttl);
  box.append(head);

  const pts = CLIPS.map(c => ({ c, g: geoOf(c) })).filter(x => x.g);
  if (!pts.length) {
    const e = document.createElement('div');
    e.className = 'mpempty';
    const lock = CLIPS.filter(c => c.eventState === 'locked').length;
    const rec = CLIPS.filter(c => c.kind === 'recent').length;
    e.innerHTML = '좌표가 있는 클립이 없어 지도를 그릴 수 없습니다.<br>'
      + (lock ? `event.json 이 잠긴 클립이 ${lock}개 있습니다 — 대시캠 암호화를 켜면 위치도 같이 잠깁니다.<br>` : '')
      + (rec ? `RecentClips ${rec}개에는 테슬라가 위치를 기록하지 않습니다.<br>` : '')
      + '위치는 SavedClips · SentryClips 의 event.json 에만 들어 있습니다.';
    box.append(e);
    return box;
  }

  /* --- 미터 좌표로 옮긴다. 몇 km 안에서는 평면으로 봐도 차이가 없다. --- */
  const las = pts.map(x => x.g.la), los = pts.map(x => x.g.lo);
  const midLa = (Math.min(...las) + Math.max(...las)) / 2;
  const midLo = (Math.min(...los) + Math.max(...los)) / 2;
  const mPerLo = 111320 * Math.cos(midLa * Math.PI / 180);
  pts.forEach(x => { x.mx = (x.g.lo - midLo) * mPerLo; x.my = (x.g.la - midLa) * 110574; });

  const wide = Math.max(...pts.map(x => Math.abs(x.mx))) * 2;
  const tall = Math.max(...pts.map(x => Math.abs(x.my))) * 2;
  // 한 지점뿐이거나 다 붙어 있으면 최소 범위를 준다. 안 그러면 확대가 무한이 된다.
  const spanX = Math.max(wide * 1.25, 150);
  const spanY = Math.max(tall * 1.25, 150);

  const note = document.createElement('span');
  note.className = 'note';
  // "몇 곳" 과 "몇 건" 은 다르다. 같은 자리에서 여러 번 찍히는 일이 흔하다.
  const nSpots = spotsOf(pts).length;
  const dks = [...new Set(pts.map(x => dayKey(x.c.at)))].sort();
  const bare = k => dayLabel(k).replace(/ \(.\)$/, '');
  const when = dks.length > 1
    ? `${bare(dks[0])} ~ ${bare(dks[dks.length - 1])} (${dks.length}일 모두)`
    : dayLabel(dks[0]);
  note.textContent = `${nSpots}곳 · 영상 ${pts.length}건 · ${when}`
    + (nSpots > 1 ? ` · 가로 ${fmtDist(Math.max(wide, 1))}` : '');
  const sp = document.createElement('span');
  sp.className = 'sp';
  head.append(sp, note);
  // 범례는 색이 무슨 뜻인지 말해 준다. 있는 것만 적는다.
  [[false, '사건'], [true, '재생 불가 (암호화)']].forEach(([e, label]) => {
    if (!pts.some(x => !!x.c.encrypted === e)) return;
    const l = document.createElement('span');
    l.className = 'mplg';
    l.innerHTML = `<i style="background:${pinFill(e)}"></i>${label}`;
    head.append(l);
  });

  // 지금 보고 있는 클립에 좌표가 없으면 지도에 아무것도 강조되지 않는다. 그 이유를 적어 준다.
  if (cur && !pts.some(x => x.c.id === cur.id)) {
    const w = document.createElement('span');
    w.className = 'note';
    w.textContent = '· 지금 보는 클립에는 좌표가 없습니다';
    head.append(w);
  }

  const sw = document.createElement('div');
  sw.className = 'modesw';
  [['one', '한 장에 모두', '타일을 받아 지도 한 장 위에 전부 찍습니다'],
   ['cards', '지점별 카드', '지점마다 OpenStreetMap 한 장씩 — 타일이 막혀도 뜹니다']].forEach(([k, label, tip]) => {
    const b = document.createElement('button');
    b.className = 'modebtn' + (mapMode === k ? ' on' : '');
    b.textContent = label;
    b.title = tip;
    b.onclick = () => { mapMode = k; LS.set('mapMode', k); redrawMap(); };
    sw.append(b);
  });
  head.append(sw);
  const connectionBar=document.createElement('div');connectionBar.className='map-connection';
  const label=document.createElement('label');
  const toggle=document.createElement('input');toggle.type='checkbox';toggle.checked=connectMapPoints;
  toggle.onchange=()=>{connectMapPoints=toggle.checked;LS.set('connectMapPoints',connectMapPoints);redrawMap();};
  label.append(toggle,document.createTextNode('시간순 연결'));connectionBar.append(label);
  const connectionNote=document.createElement('span');connectionNote.className='note';
  connectionNote.textContent=mapMode==='cards' && netOn()
    ? '연결선은 ‘한 장에 모두’에서 볼 수 있습니다.'
    : '점선·화살표 = 30분 이내 연속 위치 기록 '+mapConnections(pts).length+'개 연결 · 실제 주행 경로는 아닙니다. 위치 없는 기록은 건너 연결하지 않습니다.';
  connectionBar.append(connectionNote);box.append(connectionBar);

  if (!netOn()) {
    const off = document.createElement('div');
    off.className = 'mpempty';
    off.innerHTML = '헤더의 <b style="color:var(--ink)">지도 · 주소</b> 가 꺼져 있어 지도를 받아오지 않습니다. '
      + '켜면 나옵니다 — 나가는 것은 좌표뿐이고 영상은 나가지 않습니다. 아래는 좌표만으로 그린 그림입니다.';
    box.append(off);
  } else if (mapMode === 'cards') {
    box.append(realGrid(pts));
    return box;
  } else if (!tileFail) {
    box.append(oneMap(pts));
    const f = document.createElement('div');
    f.className = 'mpempty mpfoot';
    f.style.padding = '9px 2px 0';
    f.innerHTML = '끌어서 이동 · 휠로 확대 · 겹친 지점은 숫자로 묶이고 배율을 올리면 갈라집니다. '
      + '지도는 <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="color:var(--info)">OpenStreetMap</a> 에서 받아옵니다.';
    box.append(f);
    return box;
  } else {
    const w = document.createElement('div');
    w.className = 'ombanner';
    w.innerHTML = '<b>지도 타일을 한 장도 받지 못했습니다.</b> '
      + 'OpenStreetMap 은 <code>file://</code> 에서 온 요청을 막습니다. '
      + '같은 폴더의 <b>teslacam-viewer.bat</b> 으로 열면 <code>http://localhost</code> 로 떠서 받아집니다. '
      + '지금은 <b>지점별 카드</b>로 보세요 — 그쪽은 어디서나 뜹니다.';
    const go = document.createElement('button');
    go.className = 'btn';
    go.style.height = '30px';
    go.textContent = '지점별 카드로';
    go.onclick = () => { mapMode = 'cards'; LS.set('mapMode', 'cards'); redrawMap(); };
    const again = document.createElement('button');
    again.className = 'btn';
    again.style.cssText = 'height:30px;margin-left:6px';
    again.textContent = '다시 시도';
    again.onclick = () => { tileFail = false; redrawMap(); };
    const row = document.createElement('div');
    row.style.marginTop = '9px';
    row.append(go, again);
    w.append(row);
    box.append(w);
  }

  const wrap = document.createElement('div');
  wrap.className = 'mpbox';
  const svg = el('svg');
  wrap.append(svg);
  box.append(wrap);

  function draw() {
    const r = wrap.getBoundingClientRect();
    const w = r.width || 900, h = r.height || 360;
    if (w < 40 || h < 40) return;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const pad = 34;
    const sc = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanY);   // px / m, 가로세로 같게
    const X = m => w / 2 + m * sc;
    const Y = m => h / 2 - m * sc;

    /* 격자: 축척 막대와 같은 간격으로 깔아야 눈으로 거리를 잴 수 있다. */
    const unit = NICE_M.find(d => d * sc >= 62) || NICE_M[NICE_M.length - 1];
    const g = el('g', { class: 'gr', opacity: '.75' });
    for (let x = 0; ; x++) {
      const px = X(0) + x * unit * sc; if (px > w) break;
      g.append(el('line', { x1: px, y1: 0, x2: px, y2: h }));
    }
    for (let x = 1; ; x++) {
      const px = X(0) - x * unit * sc; if (px < 0) break;
      g.append(el('line', { x1: px, y1: 0, x2: px, y2: h }));
    }
    for (let y = 0; ; y++) {
      const py = Y(0) + y * unit * sc; if (py > h) break;
      g.append(el('line', { x1: 0, y1: py, x2: w, y2: py }));
    }
    for (let y = 1; ; y++) {
      const py = Y(0) - y * unit * sc; if (py < 0) break;
      g.append(el('line', { x1: 0, y1: py, x2: w, y2: py }));
    }
    svg.append(g);
    svg.append(routeLayer(pts,p=>[X(p.mx),Y(p.my)]));

    /* 같은 자리에 겹치는 것들은 하나로 묶는다 — 집 앞 센트리는 좌표가 똑같다. */
    const groups = [];
    pts.forEach(x => {
      const px = X(x.mx), py = Y(x.my);
      const near = groups.find(q => Math.abs(q.px - px) < 17 && Math.abs(q.py - py) < 17);
      if (near) near.list.push(x); else groups.push({ px, py, list: [x] });
    });

    groups.forEach(q => {
      q.list.sort((a, b) => b.c.at - a.c.at);
      const on = cur && q.list.some(x => x.c.id === cur.id);
      const head = q.list[0];
      const allEnc = q.list.every(x => x.c.encrypted);
      const pin = el('g', { class: 'mppin' + (on ? ' on' : '') + (allEnc ? ' enc' : '') });
      const rad = q.list.length > 1 ? 11 : 8;
      if (on) pin.append(el('circle', { cx: q.px, cy: q.py, r: rad + 5,
        fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2, opacity: '.85' }));
      // 점만 누르게 하면 과녁이 너무 작다. 보이지 않는 넓은 과녁을 덧댄다.
      pin.append(el('circle', { cx: q.px, cy: q.py, r: rad + 10, fill: 'transparent' }));
      pin.append(el('circle', { class: 'd', cx: q.px, cy: q.py, r: rad,
        fill: pinFill(allEnc) }));
      if (q.list.length > 1) {
        const n = el('text', { class: 'n', x: q.px, y: q.py + 3.5, 'text-anchor': 'middle' });
        n.textContent = q.list.length;
        pin.append(n);
      }
      const lab = el('text', { x: q.px, y: q.py - rad - 6, 'text-anchor': 'middle' });
      const shown = cur && q.list.find(x => x.c.id === cur.id);
      lab.textContent = shortWhen((shown || head).c.at, daysOf(pts) > 1, true);
      pin.append(lab);

      const addr = addrText(head.g);
      const t = el('title');
      t.textContent = q.list.map(x => fmtWhen(x.c.at) + (visibleEventName(x.c) ? ' · ' + visibleEventName(x.c) : '') + (x.c.encrypted ? ' 🔒 암호화' : '')).join('\n')
        + '\n' + (addr || '주소 확인 불가')
        + (allEnc ? '\n재생 · 저장 불가 (눌러서 이유 보기)'
          : q.list.length > 1 ? '\n눌러서 하나씩 넘겨봅니다' : '\n눌러서 재생');
      pin.append(t);

      pin.addEventListener('click', () => {
        // 겹친 자리는 누를 때마다 다음 클립으로 넘어간다.
        const i = cur ? q.list.findIndex(x => x.c.id === cur.id) : -1;
        const next = q.list[(i + 1) % q.list.length];
        pendingSeek = 0;
        select(next.c);
      });
      svg.append(pin);
    });

    /* 축척 막대 */
    const bx = 14, by = h - 16, bw = unit * sc;
    const sb = el('g');
    sb.append(el('line', { class: 'sb', x1: bx, y1: by, x2: bx + bw, y2: by }));
    sb.append(el('line', { class: 'sb', x1: bx, y1: by - 5, x2: bx, y2: by + 5 }));
    sb.append(el('line', { class: 'sb', x1: bx + bw, y1: by - 5, x2: bx + bw, y2: by + 5 }));
    const st = el('text', { class: 'sbt', x: bx + bw + 7, y: by + 4 });
    st.textContent = fmtDist(unit);
    sb.append(st);
    svg.append(sb);

    /* 북쪽 */
    const nx = w - 20, ny = 18;
    const na = el('g');
    na.append(el('line', { class: 'sb', x1: nx, y1: ny + 16, x2: nx, y2: ny }));
    na.append(el('polygon', { points: `${nx},${ny - 4} ${nx - 4},${ny + 3} ${nx + 4},${ny + 3}`,
      fill: 'var(--faint)' }));
    const nt = el('text', { class: 'nt', x: nx, y: ny + 29, 'text-anchor': 'middle' });
    nt.textContent = 'N';
    na.append(nt);
    svg.append(na);
  }

  requestAnimationFrame(draw);
  if (window.ResizeObserver) new ResizeObserver(draw).observe(wrap);

  const foot = document.createElement('div');
  foot.className = 'mpempty mpfoot';
  foot.style.padding = '0 2px';
  foot.textContent = '좌표만 상대 위치로 그린 그림입니다 — 거리 지도는 깔 수 없습니다. '
    + '고른 지점의 실제 지도는 아래 정보 카드에서 보세요.';
  box.append(foot);
  return box;
}

/** 재생 위치를 타임라인 위에 빨간 선으로. tick() 에서 부른다. */
function tlMark() {
  const tl = document.querySelector('.tl');
  if (!tl || !tl._span || !cur || !master) return;
  const mk = tl.querySelector('.tlnow');
  const sg = curSeg(cur);
  if (!mk || !sg || !sg.at) return;
  const p = (sg.at + master.currentTime * 1000 - tl._t0) / tl._span;
  if (p >= 0 && p <= 1 && dayKey(sg.at) === tl._day) {
    mk.style.display = 'block';
    mk.style.left = (p * 100) + '%';
  } else mk.style.display = 'none';
}

/** 여러 분이 이어진 덩어리면 "시작 ~ 끝". 한 분짜리면 null. */
function segSpan(c) {
  if (!c.segments || c.segments.length < 2) return null;
  const q = n => String(n).padStart(2, '0');
  const f = t => { const d = new Date(t); return `${q(d.getHours())}:${q(d.getMinutes())}`; };
  return `${f(c.segments[0].at)} ~ ${f(c.segments[c.segments.length - 1].at + 60000)}`;
}
/** 날짜까지만. 뒤에 시각 범위를 붙여 쓴다. */
function dayPart(t) {
  const d = new Date(t);
  return `${d.getMonth() + 1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
}

function drawList() {
  const list = $('#list');
  list.innerHTML = '';
  CLIPS.filter(c => filter === 'all' || c.kind === filter).forEach(c => {
    const d = document.createElement('div');
    d.className = 'item' + (cur && cur.id === c.id ? ' on' : '');
    const span = segSpan(c);
    // 최근은 덩어리 그 자체가 시간 범위다. 사건물은 사건이 난 시각이 먼저다.
    const when = (c.kind === 'recent' && span) ? `${dayPart(c.at)} ${span}` : fmtWhen(c.at);
    const len = !span ? '1분'
      : c.kind === 'recent' ? `${c.segments.length}분`
      : `${span} · ${c.segments.length}분`;
    const bits = [`카메라 ${c.cams}대`, len, mb(c.bytes)];
    if (c.encrypted) bits.push('<span style="color:var(--alert)">재생 · 저장 불가</span>');
    const p = place(c);
    const eventName = visibleEventName(c);
    d.innerHTML = `<div style="flex:1;min-width:0">
        ${eventName ? `<div class="event-name">${escapeHtml(eventName)}</div>` : ''}
        <div class="when">${when}</div>
        <div class="meta">${escapeHtml(p || (c.eventState === 'locked' ? 'event.json 잠김' : '위치 기록 없음'))}<br>${bits.join(' · ')}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
        <span class="pill ${c.kind}">${KIND_LABEL[c.kind]}</span>
        ${c.encrypted ? '<span class="pill enc">암호화</span>' : ''}
      </div>`;
    d.title = (eventName ? eventDetail(c) + '\n' : '') + when + '\n클릭해서 열기 · ↑ ↓ 로도 이동합니다';
    d.onclick = () => select(c);
    list.append(d);
  });
}

/* ---------- 재생 ---------- */

function teardown() {
  vids.forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
  urls.forEach(URL.revokeObjectURL);   // 안 지우면 큰 파일이 메모리에 그대로 쌓인다
  urls = []; vids = []; master = null; zoomed = null;
}

function select(c) {
  teardown();
  cur = c;
  drawList();
  saveView();
  const it = document.querySelector('.item.on');
  if (it) it.scrollIntoView({ block: 'nearest' });
  const main = $('#main');
  main.innerHTML = '';
  if (view === 'timeline') main.append(timelineStrip());
  else if (view === 'map') main.append(mapStrip());

  if (c.encrypted) { drawEncrypted(c); return; }

  const seg = curSeg(c);
  pz = {};
  if (!recording) { markA = markB = null; loopAB = false; }
  if (c.segments.length > 1) main.append(segRow(c));

  const grid = document.createElement('div');
  grid.className = 'grid' + (seg.files.length === 1 ? ' one' : '') + (seg.files.length > 4 ? ' multi' : '');
  grid.style.setProperty('--camera-count', seg.files.length);
  grid.style.setProperty('--camera-cols', seg.files.length === 1 ? 1 : seg.files.length <= 4 ? 2 : 3);
  grid.style.setProperty('--camera-rows', Math.ceil(seg.files.length / (seg.files.length <= 4 ? 2 : 3)));
  grid.style.setProperty('--compact-rows', Math.ceil(seg.files.length / 2));
  grid.setAttribute('aria-label', '카메라 ' + seg.files.length + '대 동기 재생');
  seg.files.forEach((f, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.cam = f.cam;
    const v = document.createElement('video');
    const u = URL.createObjectURL(f.file);
    urls.push(u);
    v.src = u;
    v.muted = true;            // 대시캠에는 소리가 없다. 켜 두면 4개가 서로 간섭만 한다.
    v.playsInline = true;
    v.preload = 'auto';
    vids.push(v);
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = f.label;
    const z = document.createElement('button');
    z.className = 'zoom';
    z.tabIndex = -1;
    z.innerHTML = ICO_IN;
    z.onclick = e => { e.stopPropagation(); zoom(f.cam); };
    // 화면을 그냥 눌러도 커지고, 다시 누르면 넷으로 돌아온다.
    cell.title = '눌러서 크게 (나머지는 오른쪽에 작게) · 다시 누르면 전체 분할 (Esc). '
      + '크게 본 뒤 휠로 확대, 끌어서 이동. 100%에서 아래로 굴리거나 Shift+휠 이면 페이지가 스크롤됩니다';
    cell.onclick = () => zoom(f.cam);
    pz[f.cam] = attachPanZoom(cell, v);
    v.onerror = () => {
      const why = v.error && v.error.code === 4
        ? '이 브라우저가 못 여는 코덱이거나 파일이 손상됐습니다'
        : '재생할 수 없습니다';
      const o = document.createElement('div');
      o.className = 'vfail';
      o.textContent = why;
      cell.append(o);
    };
    cell.append(v, tag, z);
    grid.append(cell);
  });
  main.append(grid);
  master = vids[0];
  vids.forEach(v => { v.playbackRate = rate; });

  // 같은 클립 안에서 구간을 넘겨도 보던 카메라를 계속 크게 본다.
  if (zoomClip !== c.id) { zoomClip = c.id; zoomWant = null; }
  if (zoomWant && seg.files.some(x => x.cam === zoomWant)) { zoomed = null; zoom(zoomWant); }

  main.append(controls());
  main.append(abRow());
  main.append(bottom(c));

  // 길이를 알게 되면 슬라이더 범위를 맞춘다.
  master.addEventListener('loadedmetadata', () => {
    $('#seek').max = master.duration || 0;
    if (Number.isFinite(master.duration) && master.duration > 0) seg.duration = master.duration;
    redrawAB();
    refreshInfo();
    if (pendingSeek > 0) { seek(Math.min(pendingSeek, Math.max(0,master.duration - .05))); }
    pendingSeek = 0;
    tick();
    if (autoplay) { autoplay = false; setPlay(true); }
  }, { once: true });
  master.addEventListener('timeupdate', () => {
    if (loopAB && markA != null && markB != null && master.currentTime >= markB) seek(markA);
    tick();
    const t = Date.now();
    if (t - lastSave > 2000) { lastSave = t; saveView(); }
  });
  master.addEventListener('ended', () => {
    if (recording) return; // 내보내기 중에는 녹화 대상 구간을 그대로 유지한다.
    // 1분짜리가 끝나면 다음 분으로 이어 준다. 사건은 여러 분에 걸쳐 있다.
    const i = segIndex(c);
    if (i >= 0 && i < c.segments.length - 1) { segPick[c.id] = i + 1; autoplay = true; select(c); }
    else setPlay(false);
  });

  // 재생 중 어긋나면 되돌린다. 매 프레임 맞추면 오히려 끊긴다.
  clearInterval(window.__sync);
  window.__sync = setInterval(() => {
    if (!master || master.paused) return;
    vids.forEach(v => {
      if (v !== master && Math.abs(v.currentTime - master.currentTime) > 0.3) v.currentTime = master.currentTime;
    });
  }, 1000);
}

/* ---------- 한 화면일 때의 확대·이동 ----------
   번호판처럼 작은 것을 보려면 화면 안에서 더 당겨야 한다.
   휠로 커서 지점을 기준으로 확대하고, 끌어서 옮긴다. 넷으로 보고 있을 때와
   오른쪽의 작은 화면 위에서는 휠이 페이지 스크롤이어야 하므로 아무것도 하지 않는다. */
const DL_ICON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 19h16"/></svg>';
const ICO_MINUS = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>';
const ICO_PLUS  = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const ICO_RESET = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>';

function attachPanZoom(cell, v) {
  let sc = 1, tx = 0, ty = 0;
  const MIN = 1, MAX = 10;

  const bar = document.createElement('div');
  bar.className = 'zbar';
  const mk = (html, title) => {
    const b = document.createElement('button');
    b.innerHTML = html; b.title = title; b.tabIndex = -1;
    return b;
  };
  const bOut = mk(ICO_MINUS, '축소 ( - )');
  const bIn = mk(ICO_PLUS, '확대 ( + ) · 휠로도 됩니다');
  const bRe = mk(ICO_RESET, '원래 크기로 ( 0 )');
  const lv = document.createElement('span');
  lv.className = 'lv';
  bar.append(bOut, lv, bIn, bRe);
  bar.onclick = e => e.stopPropagation();      // 막대를 눌러 전체 분할로 돌아가지 않게
  cell.append(bar);

  function clamp() {
    // 화면 밖으로 날아가지 않게 붙들어 둔다.
    const r = cell.getBoundingClientRect();
    const mx = (sc - 1) * r.width / 2, my = (sc - 1) * r.height / 2;
    tx = Math.max(-mx, Math.min(mx, tx));
    ty = Math.max(-my, Math.min(my, ty));
  }
  function apply() {
    clamp();
    v.style.transform = `translate(${tx.toFixed(1)}px, ${ty.toFixed(1)}px) scale(${sc.toFixed(3)})`;
    lv.textContent = Math.round(sc * 100) + '%';
    bOut.disabled = sc <= MIN + 0.001;
    bIn.disabled = sc >= MAX - 0.001;
  }
  /** ax, ay 는 셀 안에서의 기준점. 없으면 한가운데. */
  function to(next, ax, ay) {
    const r = cell.getBoundingClientRect();
    const cx = ax == null ? r.width / 2 : ax;
    const cy = ay == null ? r.height / 2 : ay;
    const dx = cx - r.width / 2, dy = cy - r.height / 2;
    const s2 = Math.max(MIN, Math.min(MAX, next));
    tx = dx - (dx - tx) * s2 / sc;
    ty = dy - (dy - ty) * s2 / sc;
    sc = s2;
    if (sc === MIN) { tx = 0; ty = 0; }
    apply();
  }

  bOut.onclick = e => { e.stopPropagation(); to(sc / 1.4); };
  bIn.onclick = e => { e.stopPropagation(); to(sc * 1.4); };
  bRe.onclick = e => { e.stopPropagation(); to(MIN); };

  cell.addEventListener('wheel', e => {
    if (!cell.classList.contains('big')) return;   // 넷일 때는 페이지 스크롤
    if (e.shiftKey) return;                        // Shift 를 누르면 언제나 페이지 스크롤
    const zin = e.deltaY < 0;
    // 더 커지거나 작아질 수 없는 상태면 페이지 스크롤에 양보한다.
    // 이게 없으면 100% 인 채로 아래로 굴릴 때 아무 일도 안 하면서 스크롤까지 막는다.
    if ((zin && sc >= MAX - 0.001) || (!zin && sc <= MIN + 0.001)) return;
    e.preventDefault();
    const r = cell.getBoundingClientRect();
    to(sc * (zin ? 1.18 : 1 / 1.18), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  // 끌어서 이동. 5px 안쪽으로 움직였으면 그냥 클릭으로 본다(전체 분할 토글).
  let down = null, moved = false;
  cell.addEventListener('pointerdown', e => {
    // 버튼 위에서 시작한 것은 건드리지 않는다. 포인터를 잡아 버리면 click 이
    // 버튼이 아니라 셀로 가서, + 를 눌렀는데 전체 분할로 돌아가 버린다.
    if (e.target.closest && e.target.closest('.zbar, .zoom')) return;
    if (!cell.classList.contains('big') || sc <= MIN) return;
    down = { x: e.clientX, y: e.clientY, tx, ty };
    moved = false;
    cell.setPointerCapture(e.pointerId);
    cell.classList.add('dragging');
  });
  cell.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    tx = down.tx + dx; ty = down.ty + dy;
    apply();
  });
  const end = e => {
    if (!down) return;
    down = null;
    cell.classList.remove('dragging');
    if (moved) { const stop = ev => { ev.stopPropagation(); cell.removeEventListener('click', stop, true); };

}

/** 저장·센트리 폴더에는 사건 앞뒤 10여 분이 1분짜리로 쪼개져 들어 있다. 그 분들을 고르는 줄. */
const expandedSegments = new Set();
const clockTime = t => new Date(t).toLocaleTimeString('ko-KR', {hour12:false, hour:'2-digit',minute:'2-digit',second:'2-digit'});

function clipBounds(c) {

}
function goToMoment(c, target) {
  if (recording || c.encrypted) return;
  const bounds = clipBounds(c);
  target = Math.max(bounds.start, Math.min(bounds.end - 50, target));
  let i = 0;
  for (let n=0;n<c.segments.length;n++) { if(c.segments[n].at<=target) i=n; else break; }
  const s = c.segments[i];
  let offset = (target-s.at)/1000;
  if (offset >= segmentDuration(s) && i < c.segments.length-1) {
    i++; offset=0; toast('녹화가 없는 시간입니다. 다음 영상으로 이동했습니다.');
  }

function seekRelative(delta) {

  while(t<0 && i>0) { i--; t+=segmentDuration(cur.segments[i]); }
  while(t>=segmentDuration(cur.segments[i]) && i<cur.segments.length-1) { t-=segmentDuration(cur.segments[i]); i++; }

function updateJourney() {
