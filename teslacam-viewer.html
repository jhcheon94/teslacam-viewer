/* ---------- 주소와 지도 ----------
   좌표만 보여 주면 어디였는지 감이 안 온다. 주소로 바꿔서 보여 준다.
   영상은 여전히 이 페이지 밖으로 나가지 않는다. 나가는 것은 좌표 한 쌍뿐이고,
   그것도 헤더의 "지도 · 주소" 를 끄면 아무것도 나가지 않는다. */

const PENDING = Symbol('pending');
const geoCache = new Map();     // 키 -> 주소 문자열 | null(실패) | PENDING(요청 중)
let geoQueue = [];
let geoBusy = false;
const netOn = () => $('#net').checked;
const geoKey = (la, lo) => la.toFixed(4) + ',' + lo.toFixed(4);

/** Nominatim 의 주소 조각을 한국식 순서로 잇는다. */
function krAddress(a) {
  if (!a) return null;
  const parts = [
    a.state || a.province,
    a.city || a.county,
    a.city_district || a.borough,
    a.town || a.village || a.suburb || a.quarter || a.neighbourhood,
    a.road,
    a.house_number,
  ].filter(Boolean);
  // 같은 이름이 두 번 들어가는 경우가 잦다(city 와 county 등).
  const seen = new Set();
  const out = parts.filter(x => (seen.has(x) ? false : (seen.add(x), true)));
  return out.length ? out.join(' ') : null;
}

/** 키가 필요 없고 브라우저에서 부르라고 만든 API. 시·군·면 수준. 거의 항상 된다. */
async function coarseAddr(la, lo) {
  try {
    const r = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client'
      + `?latitude=${la}&longitude=${lo}&localityLanguage=ko`);
    if (!r.ok) return null;
    const j = await r.json();
    const p = [j.principalSubdivision, j.city, j.locality].filter(Boolean);
    const seen = new Set();
    const out = p.filter(x => (seen.has(x) ? false : (seen.add(x), true)));
    return out.length ? out.join(' ') : null;
  } catch (e) { return null; }
}

/** 도로명까지 나오지만, file:// 에서는 막힐 수 있다. 되면 위의 것을 덮어쓴다. */
async function fineAddr(la, lo) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2'
      + `&lat=${la}&lon=${lo}&accept-language=ko&zoom=18`, { headers: { Accept: 'application/json' } });
    if (!r.ok) return null;
    const j = await r.json();
    return krAddress(j.address)
      || (j.display_name ? j.display_name.split(',').map(x => x.trim()).reverse().join(' ') : null);
  } catch (e) { return null; }
}

/**
 * 거친 주소를 먼저 띄우고, 자세한 주소가 오면 갈아 끼운다.
 * 자세한 쪽이 막히는 환경이 있어서 순서를 이렇게 뒀다 — 아무것도 안 나오는 것보다 낫다.
 */
async function lookup(la, lo, onPartial) {
  const coarse = await coarseAddr(la, lo);
  if (coarse && onPartial) onPartial(coarse);
  const fine = await fineAddr(la, lo);
  return fine || coarse;
}

/** 1초에 하나씩만 부른다 — 공용 무료 서비스의 사용 약속이다. */
async function geoPump() {
  if (geoBusy) return;
  geoBusy = true;
  while (geoQueue.length) {
    if (!netOn()) break;
    const { la, lo, key } = geoQueue.shift();
    if (geoCache.has(key)) continue;
    geoCache.set(key, PENDING);                 // 중복 요청 방지
    const addr = await lookup(la, lo, partial => {
      geoCache.set(key, partial);
      drawList(); redrawMap();
      if (cur) refreshInfo();
    });
    geoCache.set(key, addr);
    drawList(); redrawMap();
    if (cur) refreshInfo();
    await new Promise(r => setTimeout(r, 1100));
  }
  geoBusy = false;
}

function geoOf(c) {
  if (!c.event) return null;
  const la = parseFloat(c.event.est_lat), lo = parseFloat(c.event.est_lon);
  if (isNaN(la) || isNaN(lo)) return null;
  const key = geoKey(la, lo);
  if (netOn() && !geoCache.has(key)) { geoQueue.push({ la, lo, key }); geoPump(); }
  const v = geoCache.get(key);
  return {
    la, lo,
    addr: typeof v === 'string' ? v : null,
    state: v === undefined ? 'idle' : v === PENDING ? 'pending' : v ? 'ok' : 'fail',
  };
}

/** 주소 자리에 뭐라고 쓸지. 영영 "확인 중" 으로 남겨 두지 않는다. */
function addrText(g) {
  if (!g) return null;
  if (g.state === 'ok') return g.addr;
  if (g.state === 'pending') return '주소 확인 중…';
  if (g.state === 'fail') return '주소를 받지 못했습니다';
  return null;                                   // 스위치가 꺼져 있으면 아무 말도 안 한다
}

/* 지도.
   처음에는 Leaflet 으로 tile.openstreetmap.org 를 직접 불러왔는데 403 이 떴다.
   OSM 의 타일 서버는 자원봉사로 돌아가고, 신원이 확인되는 앱만 받는다 —
   file:// 로 연 페이지는 Referer 가 없어서 그냥 차단된다. 정책 위반이기도 하다.
   그래서 OSM 이 공식으로 내주는 임베드 페이지를 iframe 으로 띄운다.
   타일은 osm.org 가 자기 이름으로 받아오므로 막히지 않는다. */
function mapCard(la, lo, label) {
  const box = document.createElement('div');
  box.className = 'mapcard';

  const d = 0.0045;                       // 대략 500m 남짓
  const bbox = [lo - d, la - d * 0.7, lo + d, la + d * 0.7].map(x => x.toFixed(6)).join(',');
  const f = document.createElement('iframe');
  f.className = 'm';
  f.loading = 'lazy';
  f.referrerPolicy = 'no-referrer-when-downgrade';
  f.src = 'https://www.openstreetmap.org/export/embed.html'
    + `?bbox=${encodeURIComponent(bbox)}&layer=mapnik&marker=${la}%2C${lo}`;
  f.title = (label || '촬영 지점') + ' 지도';

  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = `${label ? label + ' · ' : ''}${la.toFixed(5)}, ${lo.toFixed(5)}
    &nbsp;<a href="https://www.openstreetmap.org/?mlat=${la}&mlon=${lo}#map=16/${la}/${lo}" target="_blank" rel="noopener">크게 보기</a>
    &nbsp;<a href="https://map.kakao.com/link/map/촬영지점,${la},${lo}" target="_blank" rel="noopener">카카오맵</a>
    &nbsp;<a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener">구글맵</a>
    <div style="margin-top:5px">지도와 주소는 OpenStreetMap 에서 받아옵니다. 좌표만 나가고 영상은 나가지 않습니다.</div>`;

  box.append(f, cap);
  return box;
}

/* ---------- 정보 · 저장 ---------- */

function infoCard(c) {
  const box = document.createElement('div');
  box.className = 'info';
  box.id = 'infocard';
  const e = c.event || {};
  const la = parseFloat(e.est_lat), lo = parseFloat(e.est_lon);
  const hasGeo = !isNaN(la) && !isNaN(lo);
  const trig = e.camera != null && e.camera !== '' ? (CAM_LABEL[CAM_ORDER[+e.camera]] || e.camera) : null;
  const g = geoOf(c);
  const enc = !!c.encrypted;                       // 암호화 = 재생도 저장도 안 된다
  const locked = c.eventState === 'locked';        // 위치도 같이 잠긴다
  const address = hasGeo ? ((g && g.addr) || e.city || addrText(g) || '주소 확인 중…') : null;

  box.innerHTML = `
    <div class="row"><div class="k">촬영 시각</div><div class="v">${fmtWhen(c.at)}${
      e.timestamp ? ` <span style="color:var(--faint)">(event.json: ${escapeHtml(e.timestamp)})</span>` : ''}</div></div>
    ${visibleEventName(c) ? `<div class="row"><div class="k">이벤트</div><div class="v"><strong>${escapeHtml(visibleEventName(c))}</strong><div class="sub">${escapeHtml(eventDetail(c))}</div></div></div>` : ''}
    <div class="row"><div class="k">분류</div><div class="v">${KIND_LABEL[c.kind]}${trig ? ' · 트리거 ' + escapeHtml(trig) : ''}</div></div>
    <div class="row"><div class="k">위치</div><div class="v">${
      hasGeo
        ? `<strong>${escapeHtml(address)}</strong>
           <div class="sub"><a href="https://map.kakao.com/link/map/촬영지점,${la},${lo}" target="_blank" rel="noopener">카카오맵</a>
             &nbsp;<a href="https://www.google.com/maps?q=${la},${lo}" target="_blank" rel="noopener">구글맵</a>
           </div>`
        : `${locked ? '<span class="no">읽을 수 없음</span> ' : ''}<span style="color:var(--muted)">${whyNoPlace(c)}</span>`}</div></div>
    <div class="row"><div class="k">구성</div><div class="v">${
      c.segments.length > 1
        ? `1분짜리 ${c.segments.length}구간 × 카메라 ${c.cams}대 = 파일 ${c.files.length}개 · ${mb(c.bytes)}`
        : `카메라 ${c.cams}대 · ${mb(c.bytes)}`}</div></div>
    ${c.segments.length > 1 ? `<div class="row"><div class="k">지금 구간</div><div class="v">${
      fmtWhen(curSeg(c).at)} · ${curSeg(c).files.map(f => escapeHtml(f.label)).join(' · ')} · ${mb(curSeg(c).bytes)}</div></div>` : ''}
    ${c.extras.length ? `<div class="row"><div class="k">기타 파일</div><div class="v">${
      c.extras.map(x => escapeHtml(x.name)).join(', ')} <span style="color:var(--faint)">— 이름 규칙에서 벗어나 구간에 넣지 않았습니다</span></div></div>` : ''}`;

  // 암호화된 클립에는 저장 상자를 아예 두지 않는다. 잠근 버튼도 자리를 차지하고,
  // 여기서 할 수 있는 일은 안내 상자의 "원본 파일 그대로 복사" 하나뿐이다.
  if (enc) return box;

  // 저장 버튼이 저장 버튼으로 보여야 한다. 아이콘 · 동사 · 개수를 다 적는다.
  const seg = curSeg(c);
  const dur = master ? master.duration || 0 : 0;
  const stamped = saveMode === 'stamp';
  const save = document.createElement('div');
  save.className = 'savebox';

  const head = document.createElement('div');
  head.className = 'savehead';
  head.innerHTML = `${DL_ICON}<span>저장</span>`;
  const seg2 = document.createElement('div');
  seg2.className = 'modesw';
  [['stamp', '시각 새김', '촬영 날짜·시각과 위치를 영상에 새겨 다시 인코딩합니다. 실제 길이만큼 걸립니다.'],
   ['raw', '원본 그대로', 'USB 의 mp4 를 그대로 복사합니다. 즉시 끝나고 화질 손실이 없지만, 화면에 시각이 나오지 않습니다.']]
    .forEach(([k, label, title]) => {
      const b = document.createElement('button');
      b.className = 'modebtn' + (saveMode === k ? ' on' : '');
      b.textContent = label; b.title = title;
      b.onclick = () => { saveMode = k; LS.set('saveMode', k); refreshInfo(); };
      seg2.append(b);
    });
  head.append(seg2);
  head.insertAdjacentHTML('beforeend',
    '<span class="note" style="margin-left:auto">다운로드 폴더로 복사됩니다</span>');
  save.append(head);

  const grid = document.createElement('div');
  grid.className = 'savegrid';
  const mkSave = (label, sub, fn, primary) => {
    const b = document.createElement('button');
    b.className = 'savebtn' + (primary ? ' go' : '');
    b.innerHTML = `${DL_ICON}<span class="l">${label}</span>`
      + (sub ? `<span class="s">${sub}</span>` : '');
    b.onclick = fn;
    return b;
  };

  // 이 1분 — 카메라 전부
  grid.append(mkSave(
    `이 1분 저장 · 카메라 ${seg.files.length}대`,
    stamped
      ? `시각 새김 · ${hhmmss(dur * seg.files.length)} 걸립니다`
      : `원본 그대로 · ${mb(seg.bytes)} · 즉시`,
    () => {
      if (!stamped) {
        toast(`${seg.files.length}개 저장`);
        seg.files.forEach((f, i) => setTimeout(() => download(f.file), i * 400));
        return;
      }
      if (!dur) { toast('영상 길이를 아직 모릅니다. 잠시 뒤 다시 눌러 주세요'); return; }
      if (!confirm(`카메라 ${seg.files.length}대를 차례로 다시 녹화합니다.\n${hhmmss(dur * seg.files.length)} 걸립니다. 계속할까요?`)) return;
      exportClips(seg.files.map(f => ({ cam: f.cam, s: 0, e: dur })), `이 1분 · 카메라 ${seg.files.length}대`);
    },
    true));

  // 사건 전체 — 재인코딩은 현실적이지 않아 원본만
  if (c.segments.length > 1) {
    grid.append(mkSave(
      '사건 전체 저장',
      `원본 그대로 · ${c.segments.length}분 · 파일 ${c.files.length}개 · ${mb(c.bytes)}`,
      () => {
        if (!confirm(`${c.files.length}개 파일 ${mb(c.bytes)} 를 원본 그대로 내려받습니다.\n브라우저가 여러 번 물어볼 수 있습니다. 계속할까요?`)) return;
        toast('저장을 시작합니다');
        c.files.concat(c.extras).forEach((f, i) => setTimeout(() => download(f.file), i * 500));
      }));
  }
  save.append(grid);

  const camRow = document.createElement('div');
  camRow.className = 'savecams';
  camRow.innerHTML = '<span class="note">카메라 하나만</span>';
  seg.files.forEach(f => {
    const b = document.createElement('button');
    b.className = 'btn sm';
    b.innerHTML = `${DL_ICON}<span>${escapeHtml(f.label)}</span>`;
    b.title = stamped
      ? `${f.label} 1분을 시각 새겨 저장 (${hhmmss(dur)})`
      : `${f.label} 1분을 원본 그대로 저장`;
    b.onclick = () => {
      if (!stamped) { toast(f.label + ' 저장'); download(f.file); return; }
      if (!dur) { toast('영상 길이를 아직 모릅니다'); return; }
      exportClips([{ cam: f.cam, s: 0, e: dur }], `${f.label} · 1분`);
    };
    camRow.append(b);
  });
  save.append(camRow);

  const tip = document.createElement('div');
  tip.className = 'note';
  tip.style.marginTop = '10px';
  tip.innerHTML = stamped
    ? '저장물 왼쪽 아래에 <b>촬영 날짜·시각</b>과 (알 수 있으면) <b>위치</b>가 새겨집니다. '
      + '화면에 나오는 것을 실시간으로 다시 녹화하는 방식이라 영상 길이만큼 걸리고 화질이 조금 떨어집니다. '
      + '일부만 필요하면 재생 막대의 <b>A</b> <b>B</b> 로 구간을 잡으세요.'
    : 'USB 의 <b>원본 mp4 를 그대로</b> 복사합니다. 즉시 끝나고 화질 손실이 없지만 '
      + '<b>화면에 시각이 나오지 않습니다.</b> 신고용이라면 "시각 새김" 을 쓰세요.';
  save.append(tip);

  box.append(save);
  return box;
}

function download(file) {
  const u = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = u;
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

/** 정보 카드와 지도. 화면이 넓으면 나란히 둔다 — 안 그러면 지도가 한참 아래로 내려간다. */
function bottom(c) {
  const row = document.createElement('div');
  row.className = 'botrow';
  row.append(infoCard(c));
  const g = geoOf(c);
  if (g && netOn()) row.append(mapCard(g.la, g.lo, fmtWhen(c.at)));
  else row.classList.add('nomap');
  return row;
}

/** 주소가 뒤늦게 도착했을 때 정보 카드만 갈아 끼운다. 지도는 그대로 둔다. */
function refreshInfo() {
  const old = document.getElementById('infocard');
  if (old && cur) old.replaceWith(infoCard(cur));
}

/* ---------- 구간만 따로 저장 ----------
   브라우저에는 mp4 를 잘라 내는 기능이 없다. 있는 것은 "화면에 나오는 것을 다시
   녹화하는" 길뿐이라, MediaRecorder 로 A~B 를 실시간으로 받아 WebM 으로 만든다.
   다시 인코딩하는 것이라 원본보다 화질이 떨어지고, 구간 길이만큼 시간이 걸린다.
   신고용이라면 자르지 말고 원본 mp4 를 그대로 내는 편이 낫다 — 그래서 아래 안내를 붙였다. */

/* 안전신문고 같은 데는 mp4 를 받는다. 크롬이 mp4 녹화를 지원하면 그걸 쓰고,
   안 되면 webm 으로 떨어진다. 확장자도 거기에 맞춘다. */
const REC_TYPES = [
  'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
  'video/mp4;codecs=avc1.42E01E',
  'video/mp4;codecs=avc1',
  'video/mp4',
  'video/webm;codecs=vp9',
  'video/webm;codecs=vp8',
  'video/webm',
];
function pickType() {
  if (!window.MediaRecorder) return null;
  return REC_TYPES.filter(t => MediaRecorder.isTypeSupported(t))[0] || null;
}
const extOf = m => (m && m.indexOf('video/mp4') === 0) ? 'mp4' : 'webm';

/** 파일 이름의 시각 + 재생 위치 = 그 프레임의 실제 촬영 시각. */
function shotTime(v) {
  const base = cur ? curSeg(cur).at : 0;
  return new Date(base + (v.currentTime || 0) * 1000);
}
function stampText(v, cam) {
  const d = shotTime(v), q = n => String(n).padStart(2, '0');
  const t = `${d.getFullYear()}-${q(d.getMonth() + 1)}-${q(d.getDate())} `
    + `${q(d.getHours())}:${q(d.getMinutes())}:${q(d.getSeconds())}`
    + '.' + Math.floor(d.getMilliseconds() / 100);
  // 신고용 캡션에는 읽기 쉬운 주소만 쓴다. 주소가 없으면 좌표 대신 시각만 남긴다.
  const g = cur ? geoOf(cur) : null;
  const where = g ? (g.addr || (cur.event && cur.event.city) || '') : '';
  const label = CAM_LABEL[cam] || cam;
  return [t, [label, where].filter(Boolean).join(' · ')];
}

/** 영상 한 장을 캔버스에 그리고, 원하면 그 위에 시각을 얹는다. */
function drawFrame(ctx, v, cam, w, h) {
  ctx.drawImage(v, 0, 0, w, h);
  const [l1, l2] = stampText(v, cam);
  const fs = Math.max(13, Math.round(h / 26));
  const pad = Math.round(fs * 0.5);
  ctx.font = `600 ${fs}px -apple-system, "Malgun Gothic", sans-serif`;
  ctx.textBaseline = 'top';
  const w1 = ctx.measureText(l1).width;
  const w2 = l2 ? ctx.measureText(l2).width : 0;
  const bw = Math.max(w1, w2) + pad * 2;
  const bh = (l2 ? fs * 2 + pad * 0.6 : fs) + pad * 2;
  const x = pad, y = h - bh - pad;
  ctx.fillStyle = 'rgba(0,0,0,.75)';
  ctx.fillRect(x, y, bw, bh);
  // 밝은 장면 위에서도 읽히게 살짝 그림자를 준다.
  ctx.shadowColor = 'rgba(0,0,0,.9)';
  ctx.shadowBlur = Math.max(2, fs / 6);
  ctx.fillStyle = '#fff';
  ctx.fillText(l1, x + pad, y + pad);
  if (l2) {
    ctx.font = `500 ${Math.round(fs * 0.82)}px -apple-system, "Malgun Gothic", sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.fillText(l2, x + pad, y + pad + fs * 1.15);
  }
  ctx.shadowBlur = 0;
}

function activeVid() {
  if (!cur) return null;
  const cam = zoomed || curSeg(cur).files[0].cam;
  const cell = document.querySelector(`.cell[data-cam="${cam}"]`);
  const v = cell && cell.querySelector('video');
  return v ? { v, cam } : null;
}

function saveBlob(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

/** 한 프레임을 그대로 PNG 로. 다시 인코딩하지 않으니 화질 손실이 없다. */
function capturePng() {
  const a = activeVid();
  if (!a || !a.v.videoWidth) { toast('아직 영상이 준비되지 않았습니다'); return; }
  const cv = document.createElement('canvas');
  cv.width = a.v.videoWidth; cv.height = a.v.videoHeight;
  drawFrame(cv.getContext('2d'), a.v, a.cam, cv.width, cv.height);
  const t = Math.round(a.v.currentTime * 10) / 10;
  cv.toBlob(b => b && saveBlob(b, `${curSeg(cur).stamp}-${a.cam}-${t}s.png`), 'image/png');
}

function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;'
      + 'background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:11px;font-size:13px';
    document.body.append(t);
  }
  t.textContent = msg;
  clearTimeout(t.__h);
  t.__h = setTimeout(() => t.remove(), 3200);
}

/** 한 카메라의 s0~e0 을 녹화해 Blob 으로. 시각·위치는 항상 새긴다. */
async function recordOne(v, cam, s0, e0, mime, onProgress) {
  const secs = e0 - s0;
  const oldRate = v.playbackRate;
  v.playbackRate = 1;                         // 빠르게 돌리면 그대로 빨라져 버린다
  const chunks = [];
  let stream = null, rec = null;
  try {
    if (v.error || v.readyState < 2) throw new Error('영상을 재생할 수 없습니다. 파일과 코덱을 확인해 주세요.');
    v.currentTime = s0;
    await new Promise(r => {
      const h = () => { v.removeEventListener('seeked', h); r(); };
      v.addEventListener('seeked', h);
      setTimeout(r, 1500);                    // seeked 가 안 오는 경우의 보험
    });

    // 영상 스트림을 그대로 받지 않고 캔버스를 거친다. 그래야 시각을 얹을 수 있다.
    const cv = document.createElement('canvas');
    cv.width = v.videoWidth || 1280;
    cv.height = v.videoHeight || 960;
    const ctx = cv.getContext('2d');
    const paint = () => drawFrame(ctx, v, cam, cv.width, cv.height);
    paint();
    stream = cv.captureStream(30);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12e6 });
    rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    rec.start(250);
    await v.play();

    await new Promise((res, rej) => {
      let lastTime = v.currentTime, lastProgress = performance.now();
      const step = () => {
        if (v.error) { rej(new Error('영상 읽기 오류로 저장을 중단했습니다.')); return; }
        if (v.currentTime !== lastTime) { lastTime=v.currentTime; lastProgress=performance.now(); }
        if (performance.now()-lastProgress > 15000) { rej(new Error('영상 재생이 멈춰 저장을 중단했습니다. 다시 시도해 주세요.')); return; }
        if (recording.cancel || v.ended || v.currentTime >= e0) { paint(); res(); return; }
        paint();
        if (onProgress) onProgress(Math.min(1, (v.currentTime - s0) / secs));
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });

    v.pause();
    rec.stop();
    await stopped;
  } finally {
    v.pause();
    if (rec && rec.state !== 'inactive') rec.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    v.playbackRate = oldRate;
  }
  return chunks.length ? new Blob(chunks, { type: mime }) : null;
}

const hhmmss = sec => sec >= 60
  ? `약 ${Math.floor(sec / 60)}분 ${Math.round(sec % 60)}초`
  : `약 ${Math.round(sec)}초`;

/**
 * 여러 카메라를 차례로 녹화해 저장한다.
 * jobs: [{cam, s, e}]  — 브라우저에는 mp4 를 자르는 기능이 없어서 실시간 재녹화뿐이다.
 */
async function exportClips(jobs, title) {
  if (recording) return;
  if (!jobs.length) return;
  const mime = pickType();
  if (!mime) { toast('이 브라우저는 영상 저장을 지원하지 않습니다'); return; }
  const total = jobs.reduce((a, j) => a + (j.e - j.s), 0);

  const box = document.createElement('div');
  box.className = 'recbox';
  box.innerHTML = `<div class="in">
      <div class="t">${title}</div>
      <div class="note" id="recnow"></div>
      <div class="p"><i></i></div>
      <div class="note">실시간으로 다시 녹화합니다. 창을 그대로 두세요.<br>
        ${extOf(mime).toUpperCase()} · 촬영 시각과 위치를 영상에 새깁니다 · 모두 ${hhmmss(total)}</div>
    </div>`;
  const pbar = box.querySelector('.p i');
  const now = box.querySelector('#recnow');
  const cancel = document.createElement('button');
  cancel.className = 'btn';
  cancel.textContent = '취소';
  cancel.style.marginTop = '12px';
  cancel.onclick = () => { recording.cancel = true; };
  box.querySelector('.in').append(cancel);
  document.body.append(box);

  recording = { cancel: false };
  setPlay(false);
  let done = 0, saved = 0;

  try {
    for (let i = 0; i < jobs.length; i++) {
      if (recording.cancel) break;
      const j = jobs[i];
      const cell = document.querySelector(`.cell[data-cam="${CSS.escape(j.cam)}"]`);
      const v = cell && cell.querySelector('video');
      if (!v) continue;
      now.textContent = `${i + 1} / ${jobs.length} · ${CAM_LABEL[j.cam] || j.cam}`;
      const blob = await recordOne(v, j.cam, j.s, j.e, mime, f => {
        pbar.style.width = ((done + (j.e - j.s) * f) / total * 100) + '%';
      });
      done += j.e - j.s;
      if (blob && !recording.cancel) {
        saveBlob(blob, `${curSeg(cur).stamp}-${j.cam}-${j.s.toFixed(1)}~${j.e.toFixed(1)}s.${extOf(mime)}`);
        saved++;
        await new Promise(r => setTimeout(r, 400));   // 연속 다운로드는 브라우저가 싫어한다
      }
    }
  } catch (e) {
    toast('저장 중 문제가 생겼습니다: ' + (e && e.message ? e.message : e));
  } finally {
    box.remove();
  }

  const cancelled = recording.cancel;
  recording = null;
  if (cancelled && !saved) toast('취소했습니다');
  else toast(`${saved}개 저장했습니다` + (cancelled ? ' (취소 전까지)' : ''));
}

/** A~B 를 지금 보고 있는 카메라로. */
function exportRange() {
  const a = activeVid();
  if (!a || !master) return;
  const dur = master.duration || 0;
  const s0 = markA == null ? 0 : markA;
  const e0 = markB == null ? dur : markB;
  if (!(e0 > s0 + 0.1)) { toast('구간이 너무 짧습니다'); return; }
  exportClips([{ cam: a.cam, s: s0, e: e0 }], `${CAM_LABEL[a.cam] || a.cam} · A–B ${(e0 - s0).toFixed(1)}초`);
}

  const shown = CLIPS.filter(c => filter === 'all' || c.kind === filter);
  const i = cur ? shown.findIndex(c => c.id === cur.id) : -1;
  if (e.key === 'i' || e.key === 'ㅑ') { e.preventDefault(); setMark('a'); }
  else if (e.key === 'o' || e.key === 'ㅐ') { e.preventDefault(); setMark('b'); }
  else if (e.key === '[') { e.preventDefault(); stepRate(-1); }
  else if (e.key === ']') { e.preventDefault(); stepRate(1); }
  else if (e.key === '\\') { e.preventDefault(); setRate(1); }
  else if (zoomed && pz[zoomed] && (e.key === '+' || e.key === '=')) { e.preventDefault(); pz[zoomed].zoom(1.4); }
  else if (zoomed && pz[zoomed] && (e.key === '-' || e.key === '_')) { e.preventDefault(); pz[zoomed].zoom(1 / 1.4); }
  else if (zoomed && pz[zoomed] && e.key === '0') { e.preventDefault(); pz[zoomed].reset(); }
  else if ((e.key === 'v' || e.key === 'ㅍ') && CLIPS.length) {
    e.preventDefault(); setViewMode(VIEWS[(VIEWS.indexOf(view) + 1) % VIEWS.length]);
  }
  else if (e.key === 'Escape' && zoomed) { e.preventDefault(); zoom(null); }
  else if (e.key === ' ' && master) { e.preventDefault(); setPlay(master.paused); }
  else if (e.key === 'ArrowLeft' && master) { e.preventDefault(); seekRelative(-5); }
  else if (e.key === 'ArrowRight' && master) { e.preventDefault(); seekRelative(5); }
  else if (e.key === 'ArrowDown' && i >= 0 && i < shown.length - 1) { e.preventDefault(); select(shown[i + 1]); }
  else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); select(shown[i - 1]); }
});
</script>
